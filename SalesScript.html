<script>
    // ================= SALES FLOW (AUTO-RESET PER HARI & KUNCI CLOCK-OUT) =================
    let salesAvailableStations = [];
    let salesTodayRecord = null;

    function applyWorkSettingsToUI() {
        const rIn = document.getElementById('salesRuleIn');
        const rOut = document.getElementById('salesRuleOut');
        const hIn = document.getElementById('headerBadgeMaxIn');
        const hOut = document.getElementById('headerBadgeMinOut');
        const sIn = document.getElementById('subLabelMaxIn');
        const sLate = document.getElementById('subLabelLateIn');
        const setIn = document.getElementById('setMaxClockIn');
        const setOut = document.getElementById('setMinClockOut');

        if (rIn) rIn.textContent = workSettings.maxClockIn + ' WIB';
        if (rOut) rOut.textContent = workSettings.minClockOut + ' WIB';
        if (hIn) hIn.textContent = workSettings.maxClockIn;
        if (hOut) hOut.textContent = workSettings.minClockOut;
        if (sIn) sIn.textContent = workSettings.maxClockIn;
        if (sLate) sLate.textContent = workSettings.maxClockIn;
        if (setIn) setIn.value = workSettings.maxClockIn;
        if (setOut) setOut.value = workSettings.minClockOut;
    }

    function loadSalesDashboard() {
        if (!currentUser) return;
        document.getElementById('salesProfileName').textContent = currentUser.nama;
        document.getElementById('salesBadgeStatus').textContent = currentUser.status;
        document.getElementById('salesProfProv').textContent = currentUser.provinsi;
        document.getElementById('salesProfStasiun').textContent = currentUser.stasiun;

        showLoading('Memuat status kehadiran hari ini...');
        google.script.run.withSuccessHandler(res => {
            hideLoading();
            if (res && res.userNotFound) {
                handleForceLogout(res.message);
                return;
            }

            if (res.settings) {
                workSettings = res.settings;
                applyWorkSettingsToUI();
            }
            document.getElementById('salesTodayDateLabel').textContent = res.serverDate;

            salesAvailableStations = res.stations || [];
            salesTodayRecord = res.todayRecord || null;

            const rec = res.todayRecord;
            const btnIn = document.getElementById('btnClockIn');
            const btnOut = document.getElementById('btnClockOut');
            const boxIn = document.getElementById('statusBoxIn');
            const badgeIn = document.getElementById('badgeBoxIn');
            const boxOut = document.getElementById('statusBoxOut');
            const badgeOut = document.getElementById('badgeBoxOut');
            const durEl = document.getElementById('salesWorkDuration');
            const noticeEl = document.getElementById('salesLockNotice');

            // Jika di hari ini belum ada record (atau sudah ganti hari baru), otomatis reset ke Belum Absen
            if (!rec) {
                stopGpsTracking(false);
                boxIn.textContent = 'Belum Clock-In';
                badgeIn.classList.add('hidden');
                boxOut.textContent = 'Terkunci';
                badgeOut.classList.add('hidden');
                durEl.textContent = 'Menunggu Clock-In';
                btnIn.disabled = false;
                btnOut.disabled = true; // Tidak bisa Clock-Out kalau belum Clock-In
                noticeEl.innerHTML = '<i class="fa-solid fa-circle-info text-teal-600 mr-1"></i> Anda wajib melakukan Clock-In terlebih dahulu untuk memulai shift.';
            } else {
                boxIn.textContent = rec.jamIn || '--:--';
                badgeIn.textContent = rec.statusIn;
                badgeIn.className = `text-[10.5px] font-bold px-2 py-0.5 rounded-full mt-1 inline-block ${
                    rec.statusIn === 'Late' ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-teal-50 text-teal-700 border border-teal-200'
                }`;
                btnIn.disabled = true;

                if (rec.jamOut) {
                    stopGpsTracking(true);
                    boxOut.textContent = rec.jamOut;
                    badgeOut.textContent = 'Completed';
                    badgeOut.className = 'text-[10.5px] font-bold px-2 py-0.5 rounded-full mt-1 inline-block bg-emerald-50 text-emerald-700 border border-emerald-200';
                    durEl.textContent = calcDurationLabel(rec.jamIn, rec.jamOut);
                    btnOut.disabled = true;
                    noticeEl.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 mr-1"></i> Kehadiran hari ini lengkap. Selamat beristirahat!';
                } else {
                    boxOut.textContent = 'Belum Out';
                    badgeOut.classList.add('hidden');
                    durEl.textContent = 'Sedang Bertugas';
                    btnOut.disabled = isTrackingDisconnected;
                    if (isTrackingDisconnected) {
                        noticeEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-rose-600 mr-1"></i> <strong class="text-rose-600">Koneksi GPS Terputus.</strong> Silakan tekan tombol <strong>"Sambungkan Ulang GPS / Map"</strong> di atas terlebih dahulu.';
                    } else {
                        noticeEl.innerHTML = `<i class="fa-solid fa-circle-info text-indigo-600 mr-1"></i> Tombol Clock-Out aktif setelah pukul <strong>${workSettings.minClockOut} WIB</strong>.`;
                    }
                    startGpsTracking(rec.idAbsen || ('ABS_' + res.serverDate + '_' + currentUser.username));
                }
            }

            // Update Rencana & Capaian Card
            const planCard = document.getElementById('salesTodayPlanCard');
            if (planCard) {
                if (rec) {
                    planCard.classList.remove('hidden');
                    document.getElementById('planCardStations').textContent = rec.stasiunIn || rec.stasiun || '-';
                    document.getElementById('planCardVisit').textContent = rec.visitKemanaIn || '-';
                    document.getElementById('planCardTargetVisit').textContent = rec.targetVisit !== '' && rec.targetVisit !== undefined ? rec.targetVisit : '-';
                    document.getElementById('planCardTargetHc').textContent = rec.targetClosingHc !== '' && rec.targetClosingHc !== undefined ? rec.targetClosingHc : '-';

                    const summaryOut = document.getElementById('planCardSummaryOut');
                    const cidSection = document.getElementById('planCardCidSection');
                    const cidListEl = document.getElementById('planCardCidList');
                    const badgePlan = document.getElementById('salesTodayPlanBadge');

                    if (rec.jamOut) {
                        badgePlan.textContent = 'Selesai Shift';
                        badgePlan.className = 'text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200';
                        summaryOut.innerHTML = `WO: <strong class="text-sky-700">${rec.aktualWo || 0}</strong> • HC: <strong class="text-indigo-700">${rec.aktualHc || 0}</strong> • Pending WO: <strong class="text-amber-700">${rec.pendingWo || 0}</strong>`;

                        if (rec.cidList) {
                            cidSection.classList.remove('hidden');
                            cidListEl.innerHTML = rec.cidList.split(',').map(c => `<span class="px-2.5 py-0.5 bg-sky-50 text-sky-800 rounded-lg font-mono-code text-xs font-bold border border-sky-200">${c.trim()}</span>`).join(' ');
                        } else {
                            cidSection.classList.add('hidden');
                        }
                    } else {
                        badgePlan.textContent = 'Shift Aktif';
                        badgePlan.className = 'text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-sky-50 text-sky-700 border border-sky-200';
                        summaryOut.textContent = 'Menunggu Clock-Out';
                        cidSection.classList.add('hidden');
                    }
                } else {
                    planCard.classList.add('hidden');
                }
            }

            tableState.salesHistory.data = res.history || [];
            document.getElementById('salesHistCountLabel').textContent = `${tableState.salesHistory.data.length} riwayat`;
            renderTable('salesHistory');
        }).withFailureHandler(err => {
            hideLoading();
            Swal.fire({ icon: 'error', title: 'Gagal Memuat Data', text: err.toString(), confirmButtonColor: '#0f766e' });
        }).getSalesTodayStatus(currentUser.username, currentUser.nama);
    }

    function renderStationCheckboxes(containerId, nameAttr, preSelectedList = []) {
        const container = document.getElementById(containerId);
        if (!container) return;

        let selectedSet = new Set();
        if (Array.isArray(preSelectedList)) {
            preSelectedList.forEach(s => selectedSet.add(String(s).trim().toLowerCase()));
        } else if (typeof preSelectedList === 'string' && preSelectedList.trim()) {
            preSelectedList.split(',').forEach(s => selectedSet.add(s.trim().toLowerCase()));
        }

        let stations = salesAvailableStations;
        if (!stations || stations.length === 0) {
            if (currentUser && currentUser.stasiun) {
                stations = [{ id: 'USR_STN', namaStasiun: currentUser.stasiun, kota: currentUser.provinsi || '' }];
            } else {
                container.innerHTML = '<div class="col-span-2 text-center text-slate-400 py-3 text-xs">Belum ada database stasiun yang tersimpan.</div>';
                return;
            }
        }

        container.innerHTML = stations.map((st, idx) => {
            const isChecked = selectedSet.has(st.namaStasiun.trim().toLowerCase());
            const inputId = `${nameAttr}_${idx}`;
            const activeClass = isChecked ? 'border-teal-500 bg-teal-50/60 shadow-2xs' : 'border-slate-200 bg-white hover:bg-slate-50';
            return `
                <label for="${inputId}" class="flex items-center gap-2.5 p-2.5 rounded-xl border ${activeClass} cursor-pointer transition select-none touch-manipulation">
                    <input type="checkbox" id="${inputId}" name="${nameAttr}" value="${st.namaStasiun}" ${isChecked ? 'checked' : ''}
                        onchange="onStationCheckboxChange(this); updateSubmitButtonState();"
                        class="rounded text-teal-600 focus:ring-teal-500 w-4 h-4 border-slate-300 cursor-pointer shrink-0">
                    <div class="leading-tight min-w-0 flex-1">
                        <span class="font-bold text-slate-800 text-xs block truncate">${st.namaStasiun}</span>
                        <span class="text-[10px] text-slate-400 block">${st.kota}</span>
                    </div>
                </label>
            `;
        }).join('');
    }

    function onStationCheckboxChange(el) {
        const label = el.closest('label');
        if (!label) return;
        if (el.checked) {
            label.classList.add('border-teal-500', 'bg-teal-50/60', 'shadow-2xs');
            label.classList.remove('border-slate-200', 'bg-white');
        } else {
            label.classList.remove('border-teal-500', 'bg-teal-50/60', 'shadow-2xs');
            label.classList.add('border-slate-200', 'bg-white');
        }
    }

    function onAktualWoChange(val) {
        const num = parseInt(val, 10);
        const count = (!isNaN(num) && num > 0) ? Math.min(num, 50) : 0;
        const badge = document.getElementById('outCidCountBadge');
        if (badge) badge.textContent = `${count} Customer ID`;

        const container = document.getElementById('cidInputsContainer');
        if (!container) return;

        if (count <= 0) {
            container.innerHTML = `
                <div class="text-xs text-slate-400 italic bg-white p-3 rounded-xl border border-slate-200 text-center">
                    Tidak ada input Customer ID yang perlu diisi (Realisasi WO = 0).
                </div>
            `;
            return;
        }

        let html = '<div class="space-y-2">';
        for (let i = 1; i <= count; i++) {
            html += `
                <div class="flex items-center gap-2 bg-white p-2.5 rounded-xl border border-slate-200 focus-within:border-sky-500 focus-within:ring-2 focus-within:ring-sky-500/10 shadow-2xs">
                    <span class="text-xs font-bold text-sky-800 px-2.5 py-1 bg-sky-50 rounded-lg shrink-0">Customer ID #${i}</span>
                    <input type="text" name="cidInputItem" placeholder="Nomor Customer ID #${i}" oninput="updateSubmitButtonState()"
                        class="w-full text-xs sm:text-sm font-mono-code px-2 py-1 border-0 focus:outline-none text-slate-800 bg-transparent">
                </div>
            `;
        }
        html += '</div>';
        container.innerHTML = html;
    }

    async function openAttendanceModal(type) {
        if (type === 'OUT') {
            if (isTrackingDisconnected) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Koneksi GPS Terputus!',
                    text: 'Koneksi pelacakan GPS terputus. Anda wajib menekan tombol "Sambungkan Ulang GPS / Map" terlebih dahulu sebelum melakukan Clock-Out.',
                    confirmButtonColor: '#0284c7'
                });
                return;
            }

            const nowStr = new Date().toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour12: false });
            const parts = nowStr.split(':').map(Number);
            const nowSec = (parts[0] * 3600) + (parts[1] * 60) + (parts[2] || 0);
            const [minH, minM] = workSettings.minClockOut.split(':').map(Number);
            const minOutSec = (minH * 3600) + ((minM || 0) * 60);

            if (nowSec < minOutSec) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Belum Waktunya Clock-Out',
                    text: `Clock-Out baru dibuka minimal pukul ${workSettings.minClockOut} WIB.`,
                    confirmButtonColor: '#0f766e'
                });
                return;
            }
        }

        currentAttendanceType = type;
        nativePhotoBase64 = null;
        document.getElementById('nativeCameraInput').value = '';
        document.getElementById('photoPreview').classList.add('hidden');
        document.getElementById('cameraStream').classList.remove('hidden');
        document.getElementById('cameraFallbackOverlay').classList.add('hidden');
        document.getElementById('cameraFallbackOverlay').classList.remove('flex');

        const formIn = document.getElementById('formClockInSection');
        const formOut = document.getElementById('formClockOutSection');
        const submitBtn = document.getElementById('btnSubmitCapture');

        if (type === 'IN') {
            document.getElementById('modalTitle').textContent = 'Konfirmasi Clock-In & Penugasan Harian';
            document.getElementById('modalSubTitle').textContent = 'Pilih stasiun bertugas, target visit/closing & ambil foto selfie';
            formIn.classList.remove('hidden');
            formOut.classList.add('hidden');
            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane mr-1.5"></i> Ambil Foto & Kirim Clock-In';

            // Pre-check stasiun default sales
            const defaultSelected = currentUser && currentUser.stasiun ? [currentUser.stasiun] : [];
            renderStationCheckboxes('inStationContainer', 'inStationCheckbox', defaultSelected);

            document.getElementById('inTargetVisit').value = '';
            document.getElementById('inTargetClosingHc').value = '';
            document.getElementById('inVisitKemana').value = '';

        } else {
            document.getElementById('modalTitle').textContent = 'Konfirmasi Clock-Out & Laporan Hasil Kerja';
            document.getElementById('modalSubTitle').textContent = 'Pilih stasiun aktual, isi capaian WO & HC & ambil foto selfie';
            formIn.classList.add('hidden');
            formOut.classList.remove('hidden');
            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane mr-1.5"></i> Ambil Foto & Kirim Clock-Out';

            // Pre-check stasiun yang dipilih saat Clock-In
            let preSelectedOut = [];
            if (salesTodayRecord && salesTodayRecord.stasiunIn) {
                preSelectedOut = salesTodayRecord.stasiunIn.split(',').map(s => s.trim());
            } else if (currentUser && currentUser.stasiun) {
                preSelectedOut = [currentUser.stasiun];
            }
            renderStationCheckboxes('outStationContainer', 'outStationCheckbox', preSelectedOut);

            document.getElementById('outVisitKemana').value = (salesTodayRecord && salesTodayRecord.visitKemanaIn) || '';
            document.getElementById('outAktualWo').value = '';
            document.getElementById('outAktualHc').value = '';
            document.getElementById('outPendingWo').value = '';
            onAktualWoChange(0);
        }

        document.getElementById('cameraModal').classList.remove('hidden');
        document.getElementById('cameraModal').classList.add('flex');
        updateSubmitButtonState();

        await retryLiveCamera();
        fetchGpsLocation();
    }

    function captureAndSubmit() {
        const payload = {
            type: currentAttendanceType,
            username: currentUser.username,
            nama: currentUser.nama,
            status: currentUser.status,
            provinsi: currentUser.provinsi,
            stasiun: currentUser.stasiun,
            lat: currentLocation.lat,
            lng: currentLocation.lng
        };

        if (currentAttendanceType === 'IN') {
            const checkedStations = Array.from(document.querySelectorAll('input[name="inStationCheckbox"]:checked')).map(el => el.value);
            if (checkedStations.length === 0) {
                Swal.fire({ icon: 'warning', title: 'Stasiun Belum Dipilih', text: 'Pilih minimal satu stasiun penugasan hari ini.', confirmButtonColor: '#0284c7' });
                return;
            }

            const targetVisit = document.getElementById('inTargetVisit').value.trim();
            if (targetVisit === '') {
                Swal.fire({ icon: 'warning', title: 'Target Kunjungan Wajib Diisi', text: 'Masukkan angka target kunjungan Anda hari ini.', confirmButtonColor: '#0284c7' });
                return;
            }

            const targetClosingHc = document.getElementById('inTargetClosingHc').value.trim();
            if (targetClosingHc === '') {
                Swal.fire({ icon: 'warning', title: 'Target Closing HC Wajib Diisi', text: 'Masukkan angka target closing HC Anda hari ini.', confirmButtonColor: '#0284c7' });
                return;
            }

            const visitKemana = document.getElementById('inVisitKemana').value.trim();
            if (!visitKemana) {
                Swal.fire({ icon: 'warning', title: 'Rencana Kunjungan Belum Diisi', text: 'Masukkan area/tujuan kunjungan Anda (contoh: rangkah, ploso, tmbk sari).', confirmButtonColor: '#0284c7' });
                return;
            }

            payload.stasiunIn = checkedStations;
            payload.targetVisit = Number(targetVisit);
            payload.targetClosingHc = Number(targetClosingHc);
            payload.visitKemanaIn = visitKemana;

        } else if (currentAttendanceType === 'OUT') {
            const checkedStations = Array.from(document.querySelectorAll('input[name="outStationCheckbox"]:checked')).map(el => el.value);
            if (checkedStations.length === 0) {
                Swal.fire({ icon: 'warning', title: 'Stasiun Belum Dipilih', text: 'Pilih minimal satu stasiun yang telah Anda kunjungi.', confirmButtonColor: '#0284c7' });
                return;
            }

            const visitKemanaOut = document.getElementById('outVisitKemana').value.trim();
            if (!visitKemanaOut) {
                Swal.fire({ icon: 'warning', title: 'Realisasi Kunjungan Belum Diisi', text: 'Masukkan area kunjungan yang telah Anda kunjungi hari ini.', confirmButtonColor: '#0284c7' });
                return;
            }

            const aktualWoVal = document.getElementById('outAktualWo').value.trim();
            if (aktualWoVal === '') {
                Swal.fire({ icon: 'warning', title: 'Realisasi WO Belum Diisi', text: 'Masukkan angka Realisasi WO yang didapat hari ini (bisa 0 jika tidak ada).', confirmButtonColor: '#0284c7' });
                return;
            }
            const aktualWo = Number(aktualWoVal);

            const aktualHcVal = document.getElementById('outAktualHc').value.trim();
            if (aktualHcVal === '') {
                Swal.fire({ icon: 'warning', title: 'Realisasi HC Belum Diisi', text: 'Masukkan angka Realisasi Closing HC yang didapat hari ini (bisa 0 jika tidak ada).', confirmButtonColor: '#0284c7' });
                return;
            }
            const aktualHc = Number(aktualHcVal);

            const pendingWoVal = document.getElementById('outPendingWo').value.trim();
            if (pendingWoVal === '') {
                Swal.fire({ icon: 'warning', title: 'Pending WO Belum Diisi', text: 'Masukkan angka Pending WO (bisa 0 jika tidak ada).', confirmButtonColor: '#0284c7' });
                return;
            }
            const pendingWo = Number(pendingWoVal);

            // Validasi Customer ID sesuai jumlah Realisasi WO
            let cidList = [];
            if (aktualWo > 0) {
                const cidInputs = Array.from(document.querySelectorAll('input[name="cidInputItem"]'));
                for (let i = 0; i < cidInputs.length; i++) {
                    const val = cidInputs[i].value.trim();
                    if (!val) {
                        Swal.fire({
                            icon: 'warning',
                            title: 'Nomor Customer ID Belum Lengkap',
                            text: `Harap isi nomor Customer ID #${i + 1} sesuai jumlah Realisasi WO (${aktualWo} data).`,
                            confirmButtonColor: '#0284c7'
                        });
                        return;
                    }
                    cidList.push(val);
                }
            }

            payload.stasiunOut = checkedStations;
            payload.visitKemanaOut = visitKemanaOut;
            payload.aktualWo = aktualWo;
            payload.aktualHc = aktualHc;
            payload.pendingWo = pendingWo;
            payload.cidList = cidList;
        }

        let finalImageBase64 = nativePhotoBase64;
        if (!finalImageBase64 && mediaStream) {
            const video = document.getElementById('cameraStream');
            const canvas = document.getElementById('cameraCanvas');
            canvas.width = 480;
            canvas.height = 640;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            finalImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
        }

        if (!finalImageBase64) {
            Swal.fire({ icon: 'warning', title: 'Foto Belum Ada', text: 'Pastikan kamera aktif atau gunakan tombol Kamera HP.', confirmButtonColor: '#0f766e' });
            return;
        }

        if (!currentLocation.lat || !currentLocation.lng) {
            Swal.fire({ icon: 'warning', title: 'GPS Belum Siap', text: 'Titik koordinat GPS belum terdeteksi. Silakan klik tombol Refresh GPS.', confirmButtonColor: '#0f766e' });
            return;
        }

        payload.imageBase64 = finalImageBase64;

        closeAttendanceModal();
        showLoading('Menyimpan laporan ke sistem & upload foto...');

        google.script.run.withSuccessHandler(res => {
            hideLoading();
            if (res && res.userNotFound) {
                handleForceLogout(res.message);
                return;
            }
            if (res.success) {
                Swal.fire({ icon: 'success', title: 'Berhasil', text: res.message, confirmButtonColor: '#0f766e' });
                if (currentAttendanceType === 'IN' && res.idAbsen) {
                    startGpsTracking(res.idAbsen, currentLocation);
                } else if (currentAttendanceType === 'OUT') {
                    if (isTrackingActive) {
                        recordTrackingPoint('CLOCK_OUT', currentLocation.lat, currentLocation.lng, 'Titik Clock-Out Selesai Shift', currentLocation.accuracy || 10);
                        stopGpsTracking(true);
                    }
                }
                loadSalesDashboard();
            } else {
                Swal.fire({ icon: 'error', title: 'Ditolak', text: res.message, confirmButtonColor: '#0f766e' });
            }
        }).withFailureHandler(err => {
            hideLoading();
            Swal.fire({ icon: 'error', title: 'Gagal Kirim', text: err.toString(), confirmButtonColor: '#0f766e' });
        }).submitAttendance(payload);
    }

    // ================= GPS LIVE TRACKING SERVICE =================
    const GPS_STORAGE_PREFIX = 'starlite_gps_trail_';
    let trackingIdAbsen = null;
    let trackingWatchId = null;
    let trackingHeartbeatTimer = null;
    let trackingWakeLock = null;
    let isTrackingActive = false;
    let isTrackingDisconnected = false;
    let lastKnownPosition = null;
    let lastRecordedPosition = null;
    let lastPositionTimestamp = 0;
    let localWaypoints = [];
    let pendingSyncQueue = [];
    let isSyncingGps = false;

    function formatTimeNow_() {
        return new Date().toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour12: false });
    }

    function calcDistanceMeters_(lat1, lon1, lat2, lon2) {
        if (!lat1 || !lon1 || !lat2 || !lon2) return 0;
        const R = 6371e3; // metres
        const p1 = lat1 * Math.PI / 180;
        const p2 = lat2 * Math.PI / 180;
        const dp = (lat2 - lat1) * Math.PI / 180;
        const dl = (lon2 - lon1) * Math.PI / 180;

        const a = Math.sin(dp/2) * Math.sin(dp/2) +
                  Math.cos(p1) * Math.cos(p2) *
                  Math.sin(dl/2) * Math.sin(dl/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function calcTrailTotalKm_() {
        if (!localWaypoints || localWaypoints.length < 2) return 0;
        let totalMeters = 0;
        let lastP = null;
        for (let p of localWaypoints) {
            if (p && typeof p.lat === 'number' && typeof p.lng === 'number') {
                if (lastP) {
                    const d = calcDistanceMeters_(lastP.lat, lastP.lng, p.lat, p.lng);
                    if (d < 50000) { // filter anomalies > 50km
                        totalMeters += d;
                    }
                }
                lastP = p;
            }
        }
        return Math.round((totalMeters / 1000) * 100) / 100;
    }

    // ================= HP NOTIFICATION BAR & BACKGROUND KEEP-ALIVE =================
    function requestMobileNotificationPermission() {
        if ('Notification' in window && Notification.permission === 'default') {
            try {
                Notification.requestPermission().then(perm => {
                    if (perm === 'granted') {
                        updateHpNotification('CONNECTED');
                    }
                });
            } catch (e) {}
        }
    }

    function updateHpNotification(statusType) {
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        try {
            if (statusType === 'CONNECTED') {
                new Notification('Starlite: GPS Aktif & Tersambung', {
                    body: 'Pelacakan rute presensi berjalan aktif di latar belakang.',
                    icon: 'https://lh3.googleusercontent.com/d/1uhCJGvX8gNfJ7yZpVr2bfCbElsmx_n33',
                    tag: 'starlite_gps_status',
                    renotify: false,
                    silent: true
                });
            } else if (statusType === 'DISCONNECTED') {
                new Notification('PERINGATAN: Sinyal GPS Terputus!', {
                    body: 'Buka Starlite dan tekan "Harap Sambungkan Kembali" agar kehadiran tercatat.',
                    icon: 'https://lh3.googleusercontent.com/d/1uhCJGvX8gNfJ7yZpVr2bfCbElsmx_n33',
                    tag: 'starlite_gps_status',
                    renotify: true,
                    requireInteraction: true
                });
            } else if (statusType === 'RECONNECTED') {
                new Notification('Starlite: GPS Tersambung Kembali', {
                    body: 'Pelacakan rute lokasi kembali aktif normal.',
                    icon: 'https://lh3.googleusercontent.com/d/1uhCJGvX8gNfJ7yZpVr2bfCbElsmx_n33',
                    tag: 'starlite_gps_status',
                    renotify: false,
                    silent: true
                });
            }
        } catch (e) {}
    }

    function startSilentAudioKeepAlive() {
        const audio = document.getElementById('bgSilentAudio');
        if (audio) {
            audio.volume = 0.01;
            audio.play().catch(e => {
                console.log('Audio keep-alive waiting for interaction:', e);
            });
        }
    }

    function stopSilentAudioKeepAlive() {
        const audio = document.getElementById('bgSilentAudio');
        if (audio) {
            try { audio.pause(); audio.currentTime = 0; } catch (e) {}
        }
    }

    // Auto wake-up saat browser kembali difokuskan / dibuka dari minimize
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && isTrackingActive) {
            startSilentAudioKeepAlive();
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => onTrackingPositionSuccess(pos),
                    err => {},
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 10000 }
                );
            }
        }
    });

    function updateTrackingUi() {
        const card = document.getElementById('salesTrackingCard');
        if (!card) return;

        if (!isTrackingActive) {
            card.classList.add('hidden');
            return;
        }

        card.classList.remove('hidden');

        const dot = document.getElementById('trackingStatusDot');
        const title = document.getElementById('trackingStatusTitle');
        const sub = document.getElementById('trackingStatusSub');
        const distBadge = document.getElementById('trackingDistanceBadge');
        const countBadge = document.getElementById('trackingPointsCount');
        const noticeDis = document.getElementById('trackingDisconnectedNotice');
        const btnReconnect = document.getElementById('btnReconnectGps');
        const btnLabel = document.getElementById('btnReconnectGpsLabel');
        const btnOut = document.getElementById('btnClockOut');
        const noticeEl = document.getElementById('salesLockNotice');

        const totalKm = calcTrailTotalKm_();
        if (distBadge) distBadge.textContent = totalKm.toFixed(2) + ' km';
        if (countBadge) countBadge.textContent = `${localWaypoints.length} titik`;

        const lastTime = localWaypoints.length > 0 ? localWaypoints[localWaypoints.length - 1].time : formatTimeNow_();

        if (isTrackingDisconnected) {
            card.className = 'rounded-2xl p-4 border transition-all duration-200 bg-rose-50 border-rose-300 shadow-md space-y-3';
            if (dot) {
                dot.className = 'w-3 h-3 rounded-full bg-rose-500 animate-ping shrink-0 ring-4 ring-rose-400/30';
            }
            if (title) {
                title.textContent = 'GPS Terputus / Tidak Terdeteksi!';
                title.className = 'text-xs sm:text-sm font-extrabold text-rose-900 block truncate';
            }
            if (sub) {
                sub.textContent = 'Pelacakan lokasi terhenti • Tombol Clock-Out dikunci';
                sub.className = 'text-[10.5px] text-rose-700 truncate';
            }
            if (noticeDis) noticeDis.classList.remove('hidden');
            if (btnReconnect) {
                btnReconnect.disabled = false;
                btnReconnect.className = 'w-full py-3.5 px-3 bg-rose-600 hover:bg-rose-700 active:bg-rose-800 text-white font-extrabold text-xs sm:text-sm rounded-xl shadow-md transition flex items-center justify-center gap-2 touch-target animate-pulse cursor-pointer';
            }
            if (btnLabel) {
                btnLabel.innerHTML = '<i class="fa-solid fa-arrows-rotate mr-1"></i> Harap Sambungkan Kembali';
            }
            if (btnOut) {
                btnOut.disabled = true;
            }
            if (noticeEl) {
                noticeEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-rose-600 mr-1"></i> <strong class="text-rose-600">Koneksi GPS Terputus.</strong> Anda wajib menekan tombol <strong>"Harap Sambungkan Kembali"</strong> di atas terlebih dahulu sebelum Clock-Out.';
            }
            updateHpNotification('DISCONNECTED');
        } else {
            card.className = 'rounded-2xl p-4 border transition-all duration-200 bg-emerald-50/80 border-emerald-300 shadow-sm space-y-3';
            if (dot) {
                dot.className = 'w-3 h-3 rounded-full bg-emerald-500 animate-pulse shrink-0 ring-4 ring-emerald-400/20';
            }
            if (title) {
                title.textContent = 'GPS Aktif & Tersambung';
                title.className = 'text-xs sm:text-sm font-extrabold text-emerald-900 block truncate';
            }
            if (sub) {
                sub.textContent = `Pelacakan rute berjalan normal • Update: ${lastTime} WIB`;
                sub.className = 'text-[10.5px] text-emerald-700 truncate';
            }
            if (noticeDis) noticeDis.classList.add('hidden');
            if (btnReconnect) {
                btnReconnect.disabled = true;
                btnReconnect.className = 'w-full py-2.5 px-3 bg-emerald-100/90 border border-emerald-300 text-emerald-800 font-bold text-xs sm:text-sm rounded-xl transition flex items-center justify-center gap-2 cursor-not-allowed select-none';
            }
            if (btnLabel) {
                btnLabel.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 mr-1"></i> GPS Tersambung Otomatis (Latar Belakang)';
            }
            if (btnOut && salesTodayRecord && !salesTodayRecord.jamOut) {
                btnOut.disabled = false;
            }
            if (noticeEl && salesTodayRecord && !salesTodayRecord.jamOut) {
                noticeEl.innerHTML = `<i class="fa-solid fa-circle-info text-indigo-600 mr-1"></i> Tombol Clock-Out aktif setelah pukul <strong>${workSettings.minClockOut} WIB</strong>.`;
            }
        }
    }

    // Handler Utama Tombol Aksi GPS: Hanya aktif saat sinyal GPS terputus
    function handleGpsActionButtonClick() {
        if (!isTrackingDisconnected) {
            // Jika GPS masih terhubung, jangan perbarui titik manual untuk menghindari banyaknya titik berlebih
            return;
        }
        reconnectGpsTracking();
    }

    // Tombol diklik saat tersambung: Ambil lokasi seketika & tambahkan titik baru
    function forceRecordGpsPoint() {
        const btnLabel = document.getElementById('btnReconnectGpsLabel');
        const origText = btnLabel ? btnLabel.textContent : '';
        if (btnLabel) btnLabel.textContent = 'Mengunci Koordinat GPS...';

        showLoading('Mengunci titik koordinat GPS terbaru...');

        if (!navigator.geolocation) {
            hideLoading();
            if (btnLabel) btnLabel.textContent = origText;
            Swal.fire({ icon: 'error', title: 'GPS Tidak Tersedia', text: 'Browser tidak mendukung GPS Geolocation.', confirmButtonColor: '#0284c7' });
            return;
        }

        navigator.geolocation.getCurrentPosition(
            pos => {
                hideLoading();
                if (btnLabel) btnLabel.textContent = origText;

                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const acc = pos.coords.accuracy;

                recordTrackingPoint('TRACK', lat, lng, 'Pembaruan titik manual oleh sales', acc);

                Swal.fire({
                    icon: 'success',
                    title: 'Titik GPS Diperbarui',
                    html: `Koordinat berhasil dikunci:<br><span class="font-mono-code text-xs text-slate-600 font-bold">${lat.toFixed(6)}, ${lng.toFixed(6)}</span><br><span class="text-xs text-slate-500 font-semibold">Total titik tercatat: <strong>${localWaypoints.length} titik</strong></span>`,
                    confirmButtonColor: '#0284c7',
                    timer: 2500,
                    showConfirmButton: false
                });
            },
            err => {
                hideLoading();
                if (btnLabel) btnLabel.textContent = origText;
                onTrackingPositionError(err);
            },
            { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
        );
    }

    function recordTrackingPoint(type, lat, lng, note = '', acc = 10) {
        if (!lat || !lng || !trackingIdAbsen) return;
        const pt = {
            type: type,
            lat: Number(lat),
            lng: Number(lng),
            time: formatTimeNow_(),
            acc: Math.round(acc || 10),
            note: note || ''
        };
        localWaypoints.push(pt);
        pendingSyncQueue.push(pt);
        lastKnownPosition = { lat, lng };
        lastRecordedPosition = { lat, lng };
        lastPositionTimestamp = Date.now();

        try {
            localStorage.setItem(GPS_STORAGE_PREFIX + trackingIdAbsen, JSON.stringify(localWaypoints));
        } catch (e) {}

        updateTrackingUi();
        syncPendingTrackingPoints();
    }

    function syncPendingTrackingPoints(forcedStatus = null) {
        if (!trackingIdAbsen || !currentUser) return;
        if (isSyncingGps) return;
        if (pendingSyncQueue.length === 0 && !forcedStatus) return;

        const pointsToSync = pendingSyncQueue.slice();
        pendingSyncQueue = [];
        isSyncingGps = true;

        const statusKoneksi = forcedStatus || (isTrackingDisconnected ? 'DISCONNECTED' : 'CONNECTED');

        const payload = {
            idAbsen: trackingIdAbsen,
            tanggal: document.getElementById('salesTodayDateLabel').textContent || new Date().toISOString().slice(0, 10),
            username: currentUser.username,
            nama: currentUser.nama,
            statusKoneksi: statusKoneksi,
            points: pointsToSync
        };

        google.script.run.withSuccessHandler(res => {
            isSyncingGps = false;
        }).withFailureHandler(err => {
            isSyncingGps = false;
            pendingSyncQueue = pointsToSync.concat(pendingSyncQueue);
        }).syncGpsTracking(payload);
    }

    function onTrackingPositionSuccess(pos) {
        if (!isTrackingActive) return;
        lastPositionTimestamp = Date.now();

        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const acc = pos.coords.accuracy;

        lastKnownPosition = { lat, lng };

        if (isTrackingDisconnected) {
            isTrackingDisconnected = false;
            recordTrackingPoint('RECONNECTED', lat, lng, 'Koneksi GPS otomatis terhubung kembali', acc);
            updateHpNotification('RECONNECTED');
            return;
        }

        if (!lastRecordedPosition) {
            recordTrackingPoint('TRACK', lat, lng, 'Pergerakan sales', acc);
        } else {
            const dist = calcDistanceMeters_(lastRecordedPosition.lat, lastRecordedPosition.lng, lat, lng);
            if (dist >= 15) {
                recordTrackingPoint('TRACK', lat, lng, 'Pergerakan sales', acc);
            }
        }
    }

    function onTrackingPositionError(err) {
        if (!isTrackingActive) return;
        if (isTrackingDisconnected) return;

        isTrackingDisconnected = true;
        const errMsg = (err && err.message) ? err.message : 'Sinyal GPS hilang atau izin dinonaktifkan';
        const lat = lastKnownPosition ? lastKnownPosition.lat : 0;
        const lng = lastKnownPosition ? lastKnownPosition.lng : 0;

        recordTrackingPoint('DISCONNECTED', lat, lng, 'GPS Terputus: ' + errMsg);
        updateTrackingUi();
        updateHpNotification('DISCONNECTED');
    }

    async function reconnectGpsTracking() {
        const btnLabel = document.getElementById('btnReconnectGpsLabel');
        const origText = btnLabel ? btnLabel.textContent : '';
        if (btnLabel) btnLabel.textContent = 'Menghubungkan GPS...';

        showLoading('Mengunci kembali titik koordinat GPS...');

        if (!navigator.geolocation) {
            hideLoading();
            if (btnLabel) btnLabel.textContent = origText;
            Swal.fire({
                icon: 'error',
                title: 'GPS Tidak Didukung',
                text: 'Browser Anda tidak mendukung Geolocation GPS.',
                confirmButtonColor: '#0284c7'
            });
            return;
        }

        navigator.geolocation.getCurrentPosition(
            pos => {
                hideLoading();
                if (btnLabel) btnLabel.textContent = 'Perbarui Titik GPS Sekarang';

                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const acc = pos.coords.accuracy;

                isTrackingDisconnected = false;
                recordTrackingPoint('RECONNECTED', lat, lng, 'Disambungkan ulang oleh pengguna via tombol', acc);

                if (trackingWatchId !== null) {
                    try { navigator.geolocation.clearWatch(trackingWatchId); } catch(e){}
                }
                trackingWatchId = navigator.geolocation.watchPosition(
                    onTrackingPositionSuccess,
                    onTrackingPositionError,
                    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
                );

                updateTrackingUi();
                updateHpNotification('RECONNECTED');

                Swal.fire({
                    icon: 'success',
                    title: 'GPS Berhasil Terhubung',
                    text: 'Koordinat lokasi telah dipulihkan. Tombol Clock-Out sekarang siap digunakan.',
                    confirmButtonColor: '#0284c7',
                    timer: 2000,
                    showConfirmButton: false
                });
            },
            err => {
                hideLoading();
                if (btnLabel) btnLabel.textContent = origText;
                Swal.fire({
                    icon: 'error',
                    title: 'Gagal Mengunci Lokasi',
                    text: 'Gagal mendeteksi lokasi GPS (' + (err.message || 'Timeout') + '). Pastikan GPS HP aktif dan izin lokasi diizinkan.',
                    confirmButtonColor: '#0284c7'
                });
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    }

    function startGpsTracking(idAbsen, initialCoords = null) {
        if (!idAbsen) return;
        trackingIdAbsen = idAbsen;
        isTrackingActive = true;
        isTrackingDisconnected = false;

        // Mulai audio keep-alive & minta izin notifikasi bar HP
        startSilentAudioKeepAlive();
        requestMobileNotificationPermission();

        try {
            const saved = localStorage.getItem(GPS_STORAGE_PREFIX + idAbsen);
            if (saved) {
                localWaypoints = JSON.parse(saved);
            } else {
                localWaypoints = [];
            }
        } catch (e) {
            localWaypoints = [];
        }

        if (localWaypoints.length === 0 && initialCoords && initialCoords.lat && initialCoords.lng) {
            recordTrackingPoint('CLOCK_IN', initialCoords.lat, initialCoords.lng, 'Titik Awal Clock-In', initialCoords.accuracy || 10);
        }

        if ('wakeLock' in navigator) {
            try {
                navigator.wakeLock.request('screen').then(wl => {
                    trackingWakeLock = wl;
                }).catch(e => {});
            } catch (e) {}
        }

        if (navigator.geolocation && trackingWatchId === null) {
            trackingWatchId = navigator.geolocation.watchPosition(
                onTrackingPositionSuccess,
                onTrackingPositionError,
                { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }
            );
        }

        if (trackingHeartbeatTimer === null) {
            trackingHeartbeatTimer = setInterval(() => {
                if (!isTrackingActive) return;

                if (lastPositionTimestamp > 0 && (Date.now() - lastPositionTimestamp) > 240000) {
                    if (!isTrackingDisconnected) {
                        onTrackingPositionError({ message: 'GPS Heartbeat Timeout (>4 menit tanpa sinyal)' });
                    }
                }

                if (navigator.geolocation && !isTrackingDisconnected) {
                    navigator.geolocation.getCurrentPosition(
                        pos => onTrackingPositionSuccess(pos),
                        err => {},
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 15000 }
                    );
                }

                syncPendingTrackingPoints();
            }, 45000);
        }

        updateTrackingUi();
        updateHpNotification('CONNECTED');
    }

    function stopGpsTracking(isCompleted = false) {
        stopSilentAudioKeepAlive();

        if (trackingWatchId !== null) {
            try { navigator.geolocation.clearWatch(trackingWatchId); } catch(e){}
            trackingWatchId = null;
        }
        if (trackingHeartbeatTimer !== null) {
            clearInterval(trackingHeartbeatTimer);
            trackingHeartbeatTimer = null;
        }
        if (trackingWakeLock) {
            try { trackingWakeLock.release(); } catch(e){}
            trackingWakeLock = null;
        }

        if (isCompleted && trackingIdAbsen) {
            syncPendingTrackingPoints('COMPLETED');
            try {
                localStorage.removeItem(GPS_STORAGE_PREFIX + trackingIdAbsen);
            } catch (e) {}
        }

        isTrackingActive = false;
        isTrackingDisconnected = false;
        updateTrackingUi();
    }
</script>
