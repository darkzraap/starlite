<!-- ================= LOGIN VIEW ================= -->
<div id="loginView" class="min-h-screen relative flex items-center justify-center p-4 bg-slate-900 overflow-hidden">
    <!-- Ambient Background Glow -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-sky-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Brand Logo in Top-Left of Screen -->
    <div class="absolute top-5 left-5 sm:top-8 sm:left-8 flex items-center gap-3 select-none z-10">
        <div class="w-10 h-10 rounded-2xl bg-sky-500/15 border border-sky-500/30 backdrop-blur-md flex items-center justify-center shadow-lg shadow-sky-500/10 overflow-hidden p-1 shrink-0">
            <img id="appLogoTopLeft" src="https://lh3.googleusercontent.com/d/1uhCJGvX8gNfJ7yZpVr2bfCbElsmx_n33" alt="Logo" class="w-full h-full object-contain hidden"
                onload="this.classList.remove('hidden'); const i=this.nextElementSibling; if(i) i.classList.add('hidden');"
                onerror="this.classList.add('hidden'); const i=this.nextElementSibling; if(i) i.classList.remove('hidden');">
            <i class="fa-solid fa-bolt text-sky-400 text-lg"></i>
        </div>
        <div>
            <span class="font-extrabold text-base tracking-tight text-white block leading-tight">STARLITE</span>
            <span class="text-[11px] font-semibold text-slate-400 block leading-tight">Field Ops & Presensi</span>
        </div>
    </div>

    <!-- Login Modal Card -->
    <div class="w-full max-w-sm bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100 z-10 relative">
        <!-- Card Header with Top-Left Logo -->
        <div class="bg-slate-900 px-6 py-5 flex items-center gap-3.5 border-b border-slate-800">
            <div
                class="w-11 h-11 rounded-2xl bg-sky-500/15 border border-sky-500/30 flex items-center justify-center overflow-hidden p-1 shrink-0 shadow-inner">
                <img id="appLogoLogin" src="https://lh3.googleusercontent.com/d/1uhCJGvX8gNfJ7yZpVr2bfCbElsmx_n33" alt="Logo" class="w-full h-full object-contain hidden"
                    onload="this.classList.remove('hidden'); const fb=document.getElementById('loginLogoIconFallback'); if(fb) fb.classList.add('hidden');"
                    onerror="this.classList.add('hidden'); const fb=document.getElementById('loginLogoIconFallback'); if(fb) fb.classList.remove('hidden');">
                <i id="loginLogoIconFallback" class="fa-solid fa-bolt text-sky-400 text-lg"></i>
            </div>
            <div>
                <div class="flex items-center gap-1.5">
                    <span class="text-white font-extrabold text-base tracking-tight">STARLITE</span>
                    <span class="text-sky-400 text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-sky-500/20 border border-sky-500/30">OPS</span>
                </div>
                <p class="text-[11px] font-medium text-slate-400 mt-0.5">Sistem Absensi & Monitoring Presensi</p>
            </div>
        </div>

        <!-- Form Login Standar untuk memicu Autofill & Simpan Sandi di Browser Chrome -->
        <form id="loginForm" method="post" action="javascript:void(0);" autocomplete="on" onsubmit="handleLogin(event)" class="p-6 space-y-4">
            <div>
                <label for="loginUsername" class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Username</label>
                <div class="relative">
                    <i class="fa-regular fa-user absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                    <input type="text" id="loginUsername" name="username" required placeholder="Masukkan username"
                        autocomplete="username" autocapitalize="none" spellcheck="false"
                        class="w-full pl-8 pr-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-500/20 transition">
                </div>
            </div>
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label for="loginPassword" class="block text-[11px] font-bold text-slate-600 uppercase">Password</label>
                    <button type="button" onclick="togglePasswordVisibility('loginPassword', 'eyeIconLogin')"
                        class="text-[10px] text-slate-500 hover:text-sky-600 flex items-center gap-1 focus:outline-none transition">
                        <i id="eyeIconLogin" class="fa-regular fa-eye"></i>
                        <span>Lihat</span>
                    </button>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                    <input type="password" id="loginPassword" name="password" required placeholder="Masukkan password"
                        autocomplete="current-password"
                        class="w-full pl-8 pr-9 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-800 focus:bg-white focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-500/20 transition">
                </div>
            </div>
            <div class="flex items-center justify-between text-[11px] text-slate-600">
                <label class="flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" id="rememberMeCheckbox" checked class="rounded border-slate-300 text-sky-600 focus:ring-sky-500">
                    <span>Ingat sesi saya</span>
                </label>
                <span class="text-[10.5px] text-slate-400 italic">Disimpan di browser</span>
            </div>
            <button type="submit" id="loginSubmitBtn"
                class="w-full py-2.5 bg-[#0284c7] hover:bg-[#0369a1] text-white font-bold text-xs rounded-xl shadow-md shadow-sky-600/25 transition flex items-center justify-center gap-1.5">
                <span>Masuk Aplikasi</span>
                <i class="fa-solid fa-arrow-right text-[10px]"></i>
            </button>
        </form>
    </div>
</div>
