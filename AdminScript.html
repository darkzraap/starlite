<script>
    // ================= ADMIN FLOW & DASHBOARD LOGIC =================
    function getLocalDateStr_() {
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }
    let selectedDate = getLocalDateStr_();

    function syncDateInputs() {
        if (!selectedDate) {
            const adminInput = document.getElementById('adminDateFilter');
            selectedDate = (adminInput && adminInput.value) ? adminInput.value : getLocalDateStr_();
        }
        if (document.getElementById('adminDateFilter')) document.getElementById('adminDateFilter').value = selectedDate;
        if (document.getElementById('sumStartDate')) document.getElementById('sumStartDate').value = selectedDate;
        if (document.getElementById('sumEndDate')) document.getElementById('sumEndDate').value = selectedDate;
        if (document.getElementById('allMapDatePicker')) document.getElementById('allMapDatePicker').value = selectedDate;
        document.querySelectorAll('.lblSelectedDate').forEach(el => { el.textContent = selectedDate; });
    }

    function stepAdminDate(days) {
        const input = document.getElementById('adminDateFilter');
        const curr = new Date(input.value || new Date());
        curr.setDate(curr.getDate() + days);
        const pad = n => String(n).padStart(2, '0');
        input.value = `${curr.getFullYear()}-${pad(curr.getMonth() + 1)}-${pad(curr.getDate())}`;
        onHeaderDateChange();
    }

    function setAdminDateToday() {
        const input = document.getElementById('adminDateFilter');
        input.value = getLocalDateStr_();
        onHeaderDateChange();
    }

    function onHeaderDateChange() {
        const input = document.getElementById('adminDateFilter');
        if (input && input.value) selectedDate = input.value;
        syncDateInputs();
        loadAdminData();

        const allMapTab = document.getElementById('tabAllMaps');
        if (allMapTab && !allMapTab.classList.contains('hidden')) {
            loadAllSalesMapData();
        }
    }

    function changeAdminDate(days) {
        stepAdminDate(days);
    }

    function switchAdminTab(tabId) {
        const roleLower = String(currentUser && currentUser.role || '').toLowerCase();
        if ((tabId === 'tabUsers' || tabId === 'tabStations' || tabId === 'tabSettings') && roleLower !== 'admin') {
            Swal.fire({
                icon: 'warning',
                title: 'Akses Dibatasi',
                text: 'Hanya Administrator yang memiliki izin untuk mengakses kelola akun, database stasiun, atau jam kerja sistem.',
                confirmButtonColor: '#0284c7'
            });
            return;
        }

        const allTabs = ['tabMonitoring', 'tabBelumAbsen', 'tabSummary', 'tabAllLogs', 'tabAllMaps', 'tabUsers', 'tabStations', 'tabSettings'];
        const titles = {
            tabMonitoring: 'Attendance Harian',
            tabBelumAbsen: 'Daftar Belum Clock-In',
            tabSummary: 'Database Akumulasi Kehadiran Per Tanggal',
            tabAllLogs: 'Semua Database Absensi',
            tabAllMaps: 'Peta Monitoring & Pelacakan Semua Sales',
            tabUsers: 'Kelola Akun Sales & Admin',
            tabStations: 'Database Stasiun & Kota',
            tabSettings: 'Pengaturan Jam Kerja'
        };

        allTabs.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.classList.add('hidden');
            const topBtn = document.getElementById(`navBtn_${id}`);
            if (topBtn) {
                topBtn.className = 'px-2.5 py-1 rounded text-[11px] font-semibold text-slate-400 hover:text-white transition flex items-center gap-1';
            }
            const sideBtn = document.getElementById(`sideBtn_${id}`);
            if (sideBtn) {
                sideBtn.className = 'vantus-nav-item';
            }
            const mobBtn = document.getElementById(`mobileTabBtn_${id}`);
            if (mobBtn) {
                mobBtn.className = 'px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white border border-slate-200/90 text-slate-700 shrink-0 shadow-2xs';
            }
        });

        const activeEl = document.getElementById(tabId);
        if (activeEl) activeEl.classList.remove('hidden');

        const titleText = titles[tabId] || 'Attendance';
        const pageTitleEl = document.getElementById('adminPageTitle');
        if (pageTitleEl) pageTitleEl.textContent = titleText;
        const headerTitleEl = document.getElementById('adminHeaderTitle');
        if (headerTitleEl) headerTitleEl.textContent = titleText;
        const breadcrumbEl = document.getElementById('adminBreadcrumbChild');
        if (breadcrumbEl) breadcrumbEl.textContent = titleText;

        const activeTop = document.getElementById(`navBtn_${tabId}`);
        if (activeTop) {
            activeTop.className = 'px-2.5 py-1 rounded text-[11px] font-semibold bg-[#2c374b] text-white transition flex items-center gap-1';
        }
        const activeSide = document.getElementById(`sideBtn_${tabId}`);
        if (activeSide) {
            activeSide.className = 'vantus-nav-item active';
        }
        const activeMob = document.getElementById(`mobileTabBtn_${tabId}`);
        if (activeMob) {
            activeMob.className = 'px-3.5 py-1.5 rounded-xl text-xs font-bold bg-[#0284c7] border border-sky-600 text-white shrink-0 shadow-sm shadow-sky-600/30';
        }

        if (tabId === 'tabAllMaps') {
            const picker = document.getElementById('allMapDatePicker');
            if (picker) picker.value = selectedDate;
            setTimeout(() => {
                if (allSalesMapInstance) {
                    allSalesMapInstance.invalidateSize();
                }
            }, 60);
            setTimeout(() => {
                if (allSalesMapInstance) {
                    allSalesMapInstance.invalidateSize();
                }
            }, 300);
            loadAllSalesMapData();
        }
    }

    function toggleMobileSidebar(forceState) {
        const sidebar = document.getElementById('adminLeftSidebar');
        const backdrop = document.getElementById('mobileSidebarBackdrop');
        if (!sidebar || !backdrop) return;

        const isCurrentlyOpen = !sidebar.classList.contains('-translate-x-full');
        const shouldOpen = forceState !== undefined ? forceState : !isCurrentlyOpen;

        if (shouldOpen) {
            sidebar.classList.remove('-translate-x-full');
            backdrop.classList.remove('hidden');
        } else {
            sidebar.classList.add('-translate-x-full');
            backdrop.classList.add('hidden');
        }
    }

    function loadAdminData() {
        const adminInput = document.getElementById('adminDateFilter');
        if (adminInput && adminInput.value) selectedDate = adminInput.value;
        syncDateInputs();
        showLoading('Menyinkronkan database...');

        google.script.run.withSuccessHandler(res => {
            hideLoading();
            if (res.settings) {
                workSettings = res.settings;
                applyWorkSettingsToUI();
            }

            masterSalesOnly = res.salesOnly || [];
            tableState.todayLogs.data = res.todayLogs || [];
            tableState.belumAbsen.data = res.belumAbsen || [];
            tableState.allLogs.data = res.allLogs || [];
            tableState.users.data = res.users || [];

            // Simpan seluruh data master sales aktif (54 personel sales)
            masterSalesOnly = res.salesOnly || [];
            const totalSales = masterSalesOnly.length;

            // Evaluasi kehadiran per individu sales hari ini menggunakan composite key (username + nama)
            const uniqueSalesLogsMap = new Map();
            (tableState.todayLogs.data || []).forEach(l => {
                const uKey = (String(l.username || '').toLowerCase().trim()) + '|' + (String(l.nama || '').toLowerCase().trim());
                if (uKey && !uniqueSalesLogsMap.has(uKey)) {
                    uniqueSalesLogsMap.set(uKey, l);
                }
            });
            const uniqueSalesLogs = Array.from(uniqueSalesLogsMap.values());

            const onTimeCount = uniqueSalesLogs.filter(l => l.statusIn === 'On Time').length;
            const lateCount = uniqueSalesLogs.filter(l => l.statusIn === 'Late').length;
            const clockedOutCount = uniqueSalesLogs.filter(l => l.jamOut && String(l.jamOut).trim() !== '').length;
            const noClockOutCount = uniqueSalesLogs.filter(l => !l.jamOut || String(l.jamOut).trim() === '').length;
            const belumCount = Math.max(0, totalSales - uniqueSalesLogs.length);
            const rate = totalSales > 0 ? Math.round((uniqueSalesLogs.length / totalSales) * 100) : 0;

            // Hitung akumulasi jarak tempuh hari ini & rata-rata per sales aktif
            let totalKmToday = 0;
            (tableState.todayLogs.data || []).forEach(l => {
                totalKmToday += Number(l.totalJarakKm || 0);
            });
            const activeSalesToday = uniqueSalesLogs.length;
            const avgKmToday = activeSalesToday > 0 ? (totalKmToday / activeSalesToday).toFixed(2) : '0.00';

            document.getElementById('kpiTotalSales').textContent = totalSales;
            document.getElementById('kpiOnTime').textContent = onTimeCount;
            document.getElementById('kpiLate').textContent = lateCount;
            document.getElementById('kpiClockedOut').textContent = clockedOutCount;
            document.getElementById('kpiBelumAbsen').textContent = belumCount;
            document.getElementById('kpiBelumOut').textContent = noClockOutCount;
            document.getElementById('kpiAttendanceRate').textContent = rate + '%';

            const kpiAvgKm = document.getElementById('kpiAvgKm');
            if (kpiAvgKm) kpiAvgKm.innerHTML = `${avgKmToday} <span class="text-xs font-bold text-slate-400">km</span>`;
            const kpiTotalKm = document.getElementById('kpiTotalKm');
            if (kpiTotalKm) kpiTotalKm.innerHTML = `${totalKmToday.toFixed(2)} <span class="text-xs font-bold text-slate-400">km</span>`;

            const eqEl = document.getElementById('subLabelAttendanceEquation');
            if (eqEl) {
                eqEl.textContent = `${belumCount} Belum Masuk + ${noClockOutCount} Belum Pulang + ${clockedOutCount} Lengkap = ${totalSales} Sales`;
            }

            const bNavBelum = document.getElementById('badgeNavBelum');
            if (bNavBelum) bNavBelum.textContent = belumCount;
            const bNavLate = document.getElementById('badgeNavLate');
            if (bNavLate) bNavLate.textContent = lateCount;

            const bSideBelum = document.getElementById('badgeSideBelum');
            if (bSideBelum) bSideBelum.textContent = belumCount;
            const bSideLate = document.getElementById('badgeSideLate');
            if (bSideLate) bSideLate.textContent = lateCount;

            // Hitung akumulasi sesuai tanggal yang dipilih
            recalculateSummaryByDateRange();

            tableState.stations.data = res.stations || [];
            updateStationDatalist();

            renderTable('todayLogs');
            renderTable('belumAbsen');
            renderTable('allLogs');
            renderTable('users');
            renderTable('stations');
        }).withFailureHandler(err => {
            hideLoading();
            Swal.fire({ icon: 'error', title: 'Gagal Muat Data Admin', text: err.toString(), confirmButtonColor: '#0f766e' });
        }).getAdminDashboardData(selectedDate);
    }

    // ================= MODAL DETAIL PERSONEL =================
    function openUserDetailModal(username, nama) {
        const uKey = String(username).toLowerCase();
        const userObj = (tableState.users.data || []).find(u => u.username.toLowerCase() === uKey && (!nama || u.nama.toLowerCase() === String(nama).toLowerCase()));
        const userLogs = (tableState.allLogs.data || []).filter(l => l.username.toLowerCase() === uKey && (!nama || l.nama.toLowerCase() === String(nama).toLowerCase()));

        document.getElementById('detailModalName').textContent = userObj ? userObj.nama : username;
        document.getElementById('detailModalBadge').textContent = userObj ? `${userObj.status} • ${userObj.role}` : 'Sales';
        document.getElementById('detailModalSub').textContent = userObj ? `Username: ${userObj.username} | Stasiun Base: ${userObj.stasiun} (${userObj.provinsi})` : username;

        const totalHadir = userLogs.length;
        const totalOnTime = userLogs.filter(l => l.statusIn === 'On Time').length;
        const totalLate = userLogs.filter(l => l.statusIn === 'Late').length;
        const totalOut = userLogs.filter(l => l.jamOut !== '').length;

        let totalTargetVisit = 0;
        let totalAktualWo = 0;
        let totalTargetHc = 0;
        let totalAktualHc = 0;
        let totalPendingWo = 0;
        let userTotalKm = 0;
        let userTotalPts = 0;

        userLogs.forEach(l => {
            if (l.targetVisit !== '' && !isNaN(Number(l.targetVisit))) totalTargetVisit += Number(l.targetVisit);
            if (l.aktualWo !== '' && !isNaN(Number(l.aktualWo))) totalAktualWo += Number(l.aktualWo);
            if (l.targetClosingHc !== '' && !isNaN(Number(l.targetClosingHc))) totalTargetHc += Number(l.targetClosingHc);
            if (l.aktualHc !== '' && !isNaN(Number(l.aktualHc))) totalAktualHc += Number(l.aktualHc);
            if (l.pendingWo !== '' && !isNaN(Number(l.pendingWo))) totalPendingWo += Number(l.pendingWo);
            if (l.totalJarakKm !== '' && !isNaN(Number(l.totalJarakKm))) userTotalKm += Number(l.totalJarakKm);
            if (l.totalTitik !== '' && !isNaN(Number(l.totalTitik))) userTotalPts += Number(l.totalTitik);
        });

        document.getElementById('detStatHadir').textContent = totalHadir;
        document.getElementById('detStatOnTime').textContent = totalOnTime;
        document.getElementById('detStatLate').textContent = totalLate;
        document.getElementById('detStatOut').textContent = totalOut;

        const woPct = totalTargetVisit > 0 ? Math.round((totalAktualWo / totalTargetVisit) * 100) : 0;
        const hcPct = totalTargetHc > 0 ? Math.round((totalAktualHc / totalTargetHc) * 100) : 0;

        document.getElementById('detStatTargetVisit').textContent = totalTargetVisit;
        document.getElementById('detStatAktualWo').innerHTML = `${totalAktualWo} <span class="text-[10px] font-bold text-teal-600 block">(${woPct}%)</span>`;
        document.getElementById('detStatTargetHc').textContent = totalTargetHc;
        document.getElementById('detStatAktualHc').innerHTML = `${totalAktualHc} <span class="text-[10px] font-bold text-indigo-600 block">(${hcPct}%)</span>`;
        document.getElementById('detStatPendingWo').textContent = totalPendingWo;

        const userAvgKm = totalHadir > 0 ? (userTotalKm / totalHadir).toFixed(2) : '0.00';
        const detKm = document.getElementById('detStatTotalKm');
        if (detKm) detKm.textContent = `${userTotalKm.toFixed(2)} km`;
        const detAvg = document.getElementById('detStatAvgKm');
        if (detAvg) detAvg.textContent = `${userAvgKm} km/hari`;
        const detPts = document.getElementById('detStatTotalPts');
        if (detPts) detPts.textContent = `${userTotalPts} titik`;

        tableState.userDetail.data = userLogs;
        tableState.userDetail.filters = {};
        tableState.userDetail.page = 1;
        document.querySelectorAll('[id^="flt_userDetail_"]').forEach(el => { el.value = ''; });
        renderTable('userDetail');

        document.getElementById('userDetailModal').classList.remove('hidden');
        document.getElementById('userDetailModal').classList.add('flex');
    }

    function closeUserDetailModal() {
        document.getElementById('userDetailModal').classList.add('hidden');
        document.getElementById('userDetailModal').classList.remove('flex');
    }

    // ================= REKAP AKUMULASI PER RENTANG TANGGAL =================
    function recalculateSummaryByDateRange() {
        const startStr = document.getElementById('sumStartDate').value;
        const endStr = document.getElementById('sumEndDate').value;

        // Hitung jumlah hari kalender pada rentang tersebut
        let totalDaysInRange = 1;
        if (startStr && endStr) {
            const d1 = new Date(startStr);
            const d2 = new Date(endStr);
            const diffMs = d2 - d1;
            totalDaysInRange = diffMs >= 0 ? Math.floor(diffMs / 86400000) + 1 : 1;
        } else {
            // Jika mode "Semua Tanggal", hitung jumlah tanggal unik yang ada di database
            const uniqueDates = new Set((tableState.allLogs.data || []).map(l => l.tanggal));
            totalDaysInRange = Math.max(1, uniqueDates.size);
        }

        const summaryMap = {};
        masterSalesOnly.forEach(s => {
            summaryMap[s.username.toLowerCase()] = {
                id: s.id,
                username: s.username,
                nama: s.nama,
                status: s.status,
                provinsi: s.provinsi,
                stasiun: s.stasiun,
                totalHadir: 0,
                totalOnTime: 0,
                totalLate: 0,
                totalBelumOut: 0,
                totalLengkap: 0,
                totalBelumIn: totalDaysInRange,
                totalTargetVisit: 0,
                totalAktualWo: 0,
                totalTargetHc: 0,
                totalAktualHc: 0,
                totalPendingWo: 0,
                totalKm: 0,
                avgKmPerHadir: '0.00'
            };
        });

        const attendedDatesPerUser = {};

        (tableState.allLogs.data || []).forEach(log => {
            if (startStr && log.tanggal < startStr) return;
            if (endStr && log.tanggal > endStr) return;

            const uKey = log.username.toLowerCase();
            if (!summaryMap[uKey]) return;

            summaryMap[uKey].totalHadir += 1;
            if (log.statusIn === 'Late') {
                summaryMap[uKey].totalLate += 1;
            } else if (log.statusIn === 'On Time') {
                summaryMap[uKey].totalOnTime += 1;
            }

            if (log.jamOut && log.jamOut !== '') {
                summaryMap[uKey].totalLengkap += 1;
            } else {
                summaryMap[uKey].totalBelumOut += 1;
            }

            if (log.targetVisit !== '' && !isNaN(Number(log.targetVisit))) summaryMap[uKey].totalTargetVisit += Number(log.targetVisit);
            if (log.aktualWo !== '' && !isNaN(Number(log.aktualWo))) summaryMap[uKey].totalAktualWo += Number(log.aktualWo);
            if (log.targetClosingHc !== '' && !isNaN(Number(log.targetClosingHc))) summaryMap[uKey].totalTargetHc += Number(log.targetClosingHc);
            if (log.aktualHc !== '' && !isNaN(Number(log.aktualHc))) summaryMap[uKey].totalAktualHc += Number(log.aktualHc);
            if (log.pendingWo !== '' && !isNaN(Number(log.pendingWo))) summaryMap[uKey].totalPendingWo += Number(log.pendingWo);
            if (log.totalJarakKm !== '' && !isNaN(Number(log.totalJarakKm))) summaryMap[uKey].totalKm += Number(log.totalJarakKm);

            if (!attendedDatesPerUser[uKey]) attendedDatesPerUser[uKey] = new Set();
            attendedDatesPerUser[uKey].add(log.tanggal);
        });

        Object.keys(summaryMap).forEach(uKey => {
            const hadirUnikHari = attendedDatesPerUser[uKey] ? attendedDatesPerUser[uKey].size : 0;
            summaryMap[uKey].totalBelumIn = Math.max(0, totalDaysInRange - hadirUnikHari);
            const hadir = summaryMap[uKey].totalHadir;
            summaryMap[uKey].avgKmPerHadir = hadir > 0 ? (summaryMap[uKey].totalKm / hadir).toFixed(2) : '0.00';
        });

        tableState.summary.data = Object.values(summaryMap);
        tableState.summary.page = 1;
        renderTable('summary');
    }

    function setSummaryRangeAllTime() {
        document.getElementById('sumStartDate').value = '';
        document.getElementById('sumEndDate').value = '';
        recalculateSummaryByDateRange();
    }

    function handleSaveSettings(e) {
        e.preventDefault();
        const roleLower = String(currentUser && currentUser.role || '').toLowerCase();
        if (roleLower !== 'admin') {
            Swal.fire({ icon: 'error', title: 'Akses Ditolak', text: 'Hanya Admin yang dapat mengubah aturan jam kerja sistem.', confirmButtonColor: '#0284c7' });
            return;
        }

        const maxIn = document.getElementById('setMaxClockIn').value;
        const minOut = document.getElementById('setMinClockOut').value;

        showLoading('Menyimpan aturan jam kerja...');
        google.script.run.withSuccessHandler(res => {
            hideLoading();
            if (res.success) {
                workSettings = res.settings;
                applyWorkSettingsToUI();
                Swal.fire({ icon: 'success', title: 'Tersimpan', text: res.message, confirmButtonColor: '#0284c7' });
            } else {
                Swal.fire({ icon: 'error', title: 'Gagal Simpan', text: res.message, confirmButtonColor: '#0284c7' });
            }
        }).withFailureHandler(err => {
            hideLoading();
            Swal.fire({ icon: 'error', title: 'Kesalahan Sistem', text: err.toString(), confirmButtonColor: '#0284c7' });
        }).saveWorkTimeSettings(maxIn, minOut, currentUser ? currentUser.role : '');
    }

    // ================= ADMIN USER CRUD & CASCADE DELETE =================
    function handleSaveUser(e) {
        e.preventDefault();
        const roleLower = String(currentUser && currentUser.role || '').toLowerCase();
        if (roleLower !== 'admin') {
            Swal.fire({ icon: 'error', title: 'Akses Ditolak', text: 'Hanya Admin yang diizinkan menambah atau mengubah akun.', confirmButtonColor: '#0284c7' });
            return;
        }

        const userObj = {
            id: document.getElementById('usrId').value,
            nama: document.getElementById('usrNama').value.trim(),
            username: document.getElementById('usrUsername').value.trim(),
            password: document.getElementById('usrPassword').value.trim(),
            role: document.getElementById('usrRole').value,
            status: document.getElementById('usrStatus').value,
            provinsi: document.getElementById('usrProvinsi').value.trim(),
            stasiun: document.getElementById('usrStasiun').value.trim()
        };

        showLoading('Menyimpan data akun...');
        google.script.run.withSuccessHandler(res => {
            hideLoading();
            if (res.success) {
                Swal.fire({ icon: 'success', title: 'Berhasil', text: res.message, confirmButtonColor: '#0f766e' });
                closeUserModal();
                loadAdminData();
            } else {
                Swal.fire({ icon: 'error', title: 'Gagal', text: res.message, confirmButtonColor: '#0f766e' });
            }
        }).withFailureHandler(err => {
            hideLoading();
            Swal.fire({ icon: 'error', title: 'Kesalahan Sistem', text: err.toString(), confirmButtonColor: '#0f766e' });
        }).saveUserAdmin(userObj, currentUser ? currentUser.role : '');
    }

    function openUserModal(u) {
        const m = document.getElementById('modalUserForm');
        if (u) {
            editUser(u);
        } else {
            resetUserForm();
        }
        if (m) {
            m.classList.remove('hidden');
            m.classList.add('flex');
        }
    }

    function closeUserModal() {
        const m = document.getElementById('modalUserForm');
        if (m) {
            m.classList.add('hidden');
            m.classList.remove('flex');
        }
        resetUserForm();
    }

    function editUser(u) {
        document.getElementById('formUserTitle').textContent = 'Edit Akun: ' + u.nama;
        document.getElementById('usrId').value = u.id;
        document.getElementById('usrNama').value = u.nama;
        document.getElementById('usrUsername').value = u.username;
        document.getElementById('usrPassword').value = u.password;
        document.getElementById('usrRole').value = u.role;
        document.getElementById('usrStatus').value = u.status;
        document.getElementById('usrProvinsi').value = u.provinsi;
        document.getElementById('usrStasiun').value = u.stasiun;
        const m = document.getElementById('modalUserForm');
        if (m) {
            m.classList.remove('hidden');
            m.classList.add('flex');
        }
    }

    function resetUserForm() {
        document.getElementById('formUserTitle').textContent = 'Tambah Personel Sales / Pengguna Baru';
        const form = document.getElementById('userForm');
        if (form) form.reset();
        document.getElementById('usrId').value = '';
    }

    function deleteUser(id, nama) {
        const roleLower = String(currentUser && currentUser.role || '').toLowerCase();
        if (roleLower !== 'admin') {
            Swal.fire({ icon: 'error', title: 'Akses Ditolak', text: 'Hanya Admin yang diizinkan menghapus akun.', confirmButtonColor: '#0284c7' });
            return;
        }

        Swal.fire({
            title: `Hapus Akun ${nama}?`,
            text: 'Seluruh data akun DAN semua riwayat absensi milik orang ini akan dihapus permanen agar rasio % kehadiran tetap akurat.',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#e11d48',
            confirmButtonText: 'Ya, Hapus Semua!',
            cancelButtonText: 'Batal'
        }).then(result => {
            if (result.isConfirmed) {
                showLoading('Menghapus akun & seluruh riwayat absensinya...');
                google.script.run.withSuccessHandler(res => {
                    hideLoading();
                    Swal.fire({ icon: 'success', title: 'Terhapus', text: res.message, confirmButtonColor: '#0f766e' });
                    loadAdminData();
                }).withFailureHandler(err => {
                    hideLoading();
                    Swal.fire({ icon: 'error', title: 'Gagal Hapus', text: err.toString(), confirmButtonColor: '#0f766e' });
                }).deleteUserAdmin(id, currentUser ? currentUser.role : '');
            }
        });
    }

            editStation(st);

    function handleSaveStation(e) {
        e.preventDefault();
        const roleLower = String(currentUser && currentUser.role || '').toLowerCase();
        if (roleLower !== 'admin') {
            Swal.fire({ icon: 'error', title: 'Akses Ditolak', text: 'Hanya Admin yang dapat mengelola database stasiun.', confirmButtonColor: '#0f766e' });
            return;
        }

        const stationObj = {
            id: document.getElementById('stnId').value,
            kota: document.getElementById('stnKota').value.trim(),
            namaStasiun: document.getElementById('stnNama').value.trim()
        };

        showLoading('Menyimpan data stasiun...');
        google.script.run.withSuccessHandler(res => {
            hideLoading();
            if (res.success) {
                Swal.fire({ icon: 'success', title: 'Berhasil', text: res.message, confirmButtonColor: '#0f766e' });
                closeStationModal();
                if (res.stations) {
                    tableState.stations.data = res.stations;
                    updateStationDatalist();
                    renderTable('stations');
                } else {
                    loadAdminData();
                }
            } else {
                Swal.fire({ icon: 'error', title: 'Gagal', text: res.message, confirmButtonColor: '#0f766e' });
            }
        }).withFailureHandler(err => {
            hideLoading();
            Swal.fire({ icon: 'error', title: 'Kesalahan Sistem', text: err.toString(), confirmButtonColor: '#0f766e' });
        }).saveStationAdmin(stationObj, currentUser ? currentUser.role : '');
    }

    function editStation(st) {
        document.getElementById('formStationTitle').textContent = 'Edit Stasiun: ' + st.namaStasiun;
        document.getElementById('stnId').value = st.id;
        document.getElementById('stnKota').value = st.kota;
        document.getElementById('stnNama').value = st.namaStasiun;
        const m = document.getElementById('modalStationForm');
        if (m) {
            m.classList.remove('hidden');
            m.classList.add('flex');
        }
    }

    function resetStationForm() {
        document.getElementById('formStationTitle').textContent = 'Tambah Stasiun Baru';
        const form = document.getElementById('stationForm');
        if (form) form.reset();
        document.getElementById('stnId').value = '';
    }

    function deleteStation(id, namaStasiun) {
        const roleLower = String(currentUser && currentUser.role || '').toLowerCase();
        if (roleLower !== 'admin') {
            Swal.fire({ icon: 'error', title: 'Akses Ditolak', text: 'Hanya Admin yang dapat menghapus stasiun.', confirmButtonColor: '#0f766e' });
            return;
        }

        Swal.fire({
            title: `Hapus Stasiun?`,
            text: `Yakin ingin menghapus stasiun "${namaStasiun}" dari database?`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#e11d48',
            confirmButtonText: 'Ya, Hapus!',
            cancelButtonText: 'Batal'
        }).then(result => {
            if (result.isConfirmed) {
                showLoading('Menghapus data stasiun...');
                google.script.run.withSuccessHandler(res => {
                    hideLoading();
                    if (res.success) {
                        Swal.fire({ icon: 'success', title: 'Terhapus', text: res.message, confirmButtonColor: '#0f766e' });
                        if (res.stations) {
                            tableState.stations.data = res.stations;
                            updateStationDatalist();
                            renderTable('stations');
                        } else {
                            loadAdminData();
                        }
                    } else {
                        Swal.fire({ icon: 'error', title: 'Gagal', text: res.message, confirmButtonColor: '#0f766e' });

                }).withFailureHandler(err => {
                    hideLoading();
                    Swal.fire({ icon: 'error', title: 'Gagal Hapus', text: err.toString(), confirmButtonColor: '#0f766e' });

    // ================= LEAFLET MAP CONTROLLER (LIVE ROUTE TRACKING) =================
    let currentRouteMapInstance = null;
    let currentRoutePolyline = null;
    let currentRouteMarkers = [];
    let currentRouteBounds = null;
    let currentTrackingContext = null;

    function openSalesRouteMapModal(idAbsen, username, tanggal, nama) {
        currentTrackingContext = { idAbsen, username, tanggal, nama };

        const modal = document.getElementById('modalSalesRouteMap');
        if (!modal) return;

        document.getElementById('routeMapTitle').textContent = `Rute Pergerakan: ${nama}`;
        document.getElementById('routeMapSubtitle').textContent = `${username} • Tanggal: ${tanggal}`;

        modal.classList.remove('hidden');
        modal.classList.add('flex');

        showLoading('Mengambil rute pergerakan & data GPS...');
        google.script.run.withSuccessHandler(res => {
            hideLoading();
            if (!res || !res.success) {
                Swal.fire({ icon: 'info', title: 'Data Rute Kosong', text: 'Belum ada rekaman koordinat pergerakan untuk personel ini pada tanggal tersebut.', confirmButtonColor: '#0284c7' });
                return;
            }
            renderRouteMapOnLeaflet(res);
        }).withFailureHandler(err => {
            hideLoading();
            Swal.fire({ icon: 'error', title: 'Gagal Memuat Peta', text: err.toString(), confirmButtonColor: '#0284c7' });
        }).getGpsTrackingData(idAbsen, username, tanggal);
    }

    function renderRouteMapOnLeaflet(res) {
        const tracking = res.tracking || {};
        const absen = res.absenDetail || {};
        const waypoints = tracking.waypoints || [];

        // Update Stats Bar
        const distEl = document.getElementById('routeStatDistance');
        const ptsEl = document.getElementById('routeStatPoints');
        const timeEl = document.getElementById('routeStatTime');
        const disEl = document.getElementById('routeStatDisconnects');
        const statusBadge = document.getElementById('routeMapStatusBadge');

        const totalKm = (tracking.totalJarakKm !== undefined) ? Number(tracking.totalJarakKm).toFixed(2) : '0.00';
        if (distEl) distEl.textContent = `${totalKm} km`;
        if (ptsEl) ptsEl.textContent = `${waypoints.length} Titik`;
        if (timeEl) timeEl.textContent = `In: ${absen.jamIn || '--:--'} | Out: ${absen.jamOut || '--:--'}`;

        const disconnectCount = waypoints.filter(w => w.type === 'DISCONNECTED').length;
        const reconnectCount = waypoints.filter(w => w.type === 'RECONNECTED').length;

        if (disEl) {
            if (disconnectCount > 0) {
                disEl.textContent = `${disconnectCount} Putus / ${reconnectCount} Sambung`;
                disEl.className = 'text-xs sm:text-sm font-bold text-amber-600';
            } else {
                disEl.textContent = 'Stabil / Tanpa Putus';
                disEl.className = 'text-xs sm:text-sm font-bold text-emerald-600';
            }
        }

        if (statusBadge) {
            if (tracking.statusKoneksi === 'COMPLETED' || absen.jamOut) {
                statusBadge.textContent = 'Selesai Shift';
                statusBadge.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-500/20 text-slate-300 border border-slate-400/30 shrink-0';
            } else if (tracking.statusKoneksi === 'DISCONNECTED') {
                statusBadge.textContent = 'GPS Terputus';
                statusBadge.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-500/20 text-rose-300 border border-rose-400/30 shrink-0 animate-pulse';
            } else {
                statusBadge.textContent = 'GPS Aktif';
                statusBadge.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 shrink-0';
            }
        }

        if (typeof L === 'undefined') {
            console.error('Leaflet library is not loaded');
            return;
        }

        // Initialize Leaflet Map Instance jika belum dibuat
        if (!currentRouteMapInstance) {
            const routeContainer = document.getElementById('leafletRouteMap');
            if (routeContainer && routeContainer._leaflet_id) {
                routeContainer._leaflet_id = null;
                routeContainer.innerHTML = '';
            }
            try {
                currentRouteMapInstance = L.map('leafletRouteMap', {
                    zoomControl: true,
                    attributionControl: false
                }).setView([-7.2575, 112.7521], 13);

                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19
                }).addTo(currentRouteMapInstance);
            } catch (e) {
                console.error('Error creating route map instance:', e);
            }
        }

        // Clear existing markers & polyline
        currentRouteMarkers.forEach(m => currentRouteMapInstance.removeLayer(m));
        currentRouteMarkers = [];
        if (currentRoutePolyline) {
            currentRouteMapInstance.removeLayer(currentRoutePolyline);
            currentRoutePolyline = null;
        }

        if (waypoints.length === 0) {
            setTimeout(() => {
                currentRouteMapInstance.invalidateSize();
            }, 250);
            return;
        }

        const latLngs = [];
        const bounds = L.latLngBounds();

        waypoints.forEach((p, idx) => {
            if (!p || typeof p.lat !== 'number' || typeof p.lng !== 'number') return;
            const ptLatLng = [p.lat, p.lng];
            latLngs.push(ptLatLng);
            bounds.extend(ptLatLng);

            let markerIcon = null;
            let popupContent = '';

            if (p.type === 'CLOCK_IN') {
                markerIcon = L.divIcon({
                    className: 'leaflet-custom-marker',
                    html: `<div class="w-7 h-7 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold text-xs shadow-lg border-2 border-white ring-2 ring-emerald-400/50 animate-pulse"><i class="fa-solid fa-play text-[10px]"></i></div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });
                popupContent = `
                    <div class="p-1 min-w-[200px] space-y-1 text-slate-800">
                        <div class="flex items-center gap-1.5 pb-1 border-b border-slate-100 font-extrabold text-xs text-emerald-700">
                            <i class="fa-solid fa-location-crosshairs"></i> TITIK CLOCK-IN (AWAL)
                        </div>
                        <div class="text-[11px]"><span class="font-bold">Waktu:</span> ${p.time || absen.jamIn || '--:--'} WIB</div>
                        <div class="text-[11px]"><span class="font-bold">Stasiun:</span> ${absen.stasiunIn || absen.stasiun || '-'}</div>
                        <div class="text-[11px]"><span class="font-bold">Target Visit:</span> ${absen.targetVisit || '-'} | Target HC: ${absen.targetClosingHc || '-'}</div>
                        <div class="text-[10px] text-slate-400 font-mono-code pt-0.5">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div>
                        ${absen.fotoIn ? `<div class="pt-1.5"><a href="${absen.fotoIn}" target="_blank" class="block text-center py-1 bg-emerald-50 text-emerald-700 hover:bg-emerald-600 hover:text-white rounded-lg text-xs font-bold transition">Lihat Foto Masuk</a></div>` : ''}
                    </div>
                `;
            } else if (p.type === 'DISCONNECTED') {
                markerIcon = L.divIcon({
                    className: 'leaflet-custom-marker',
                    html: `<div class="w-7 h-7 rounded-full bg-rose-600 text-white flex items-center justify-center font-bold text-xs shadow-lg border-2 border-white ring-2 ring-rose-400/50"><i class="fa-solid fa-triangle-exclamation text-[11px]"></i></div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });
                popupContent = `
                    <div class="p-1 min-w-[190px] space-y-1 text-slate-800">
                        <div class="flex items-center gap-1.5 pb-1 border-b border-slate-100 font-extrabold text-xs text-rose-600">
                            <i class="fa-solid fa-link-slash"></i> SINYAL GPS TERPUTUS
                        </div>
                        <div class="text-[11px]"><span class="font-bold">Waktu:</span> ${p.time} WIB</div>
                        <div class="text-[11px] text-slate-600">${p.note || 'Koneksi GPS hilang atau izin dinonaktifkan'}</div>
                        <div class="text-[10px] text-slate-400 font-mono-code pt-0.5">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div>
                    </div>
                `;
            } else if (p.type === 'RECONNECTED') {
                markerIcon = L.divIcon({
                    className: 'leaflet-custom-marker',
                    html: `<div class="w-7 h-7 rounded-full bg-sky-500 text-white flex items-center justify-center font-bold text-xs shadow-lg border-2 border-white ring-2 ring-sky-400/50"><i class="fa-solid fa-link text-[10px]"></i></div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });
                popupContent = `
                    <div class="p-1 min-w-[190px] space-y-1 text-slate-800">
                        <div class="flex items-center gap-1.5 pb-1 border-b border-slate-100 font-extrabold text-xs text-sky-600">
                            <i class="fa-solid fa-rotate"></i> GPS TERSAMBUNG ULANG
                        </div>
                        <div class="text-[11px]"><span class="font-bold">Waktu:</span> ${p.time} WIB</div>
                        <div class="text-[11px] text-slate-600">${p.note || 'Disambungkan kembali oleh pengguna via tombol'}</div>
                        <div class="text-[10px] text-slate-400 font-mono-code pt-0.5">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div>
                    </div>
                `;
            } else if (p.type === 'CLOCK_OUT') {
                markerIcon = L.divIcon({
                    className: 'leaflet-custom-marker',
                    html: `<div class="w-7 h-7 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-xs shadow-lg border-2 border-white ring-2 ring-slate-400/50"><i class="fa-solid fa-flag-checkered text-[11px]"></i></div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });
                popupContent = `
                    <div class="p-1 min-w-[200px] space-y-1 text-slate-800">
                        <div class="flex items-center gap-1.5 pb-1 border-b border-slate-100 font-extrabold text-xs text-slate-900">
                            <i class="fa-solid fa-flag-checkered"></i> TITIK CLOCK-OUT (AKHIR)
                        </div>
                        <div class="text-[11px]"><span class="font-bold">Waktu:</span> ${p.time || absen.jamOut || '--:--'} WIB</div>
                        <div class="text-[11px]"><span class="font-bold">Stasiun:</span> ${absen.stasiunOut || absen.stasiun || '-'}</div>
                        <div class="text-[11px]"><span class="font-bold">Realisasi:</span> WO ${absen.aktualWo || 0} | HC ${absen.aktualHc || 0}</div>
                        <div class="text-[10px] text-slate-400 font-mono-code pt-0.5">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div>
                        ${absen.fotoOut ? `<div class="pt-1.5"><a href="${absen.fotoOut}" target="_blank" class="block text-center py-1 bg-slate-900 text-white hover:bg-slate-800 rounded-lg text-xs font-bold transition">Lihat Foto Pulang</a></div>` : ''}
                    </div>
                `;
            } else if (idx === 0 || idx === waypoints.length - 1) {
                // Pin umum untuk titik batas jika bukan Clock-In/Out
                markerIcon = L.divIcon({
                    className: 'leaflet-custom-marker',
                    html: `<div class="w-5 h-5 rounded-full bg-orange-600 text-white flex items-center justify-center font-bold text-[9px] shadow border border-white"><i class="fa-solid fa-location-dot"></i></div>`,
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
                popupContent = `<div class="p-1 text-xs"><b>Titik #${idx + 1}</b><br>Waktu: ${p.time} WIB</div>`;
            }

            if (markerIcon) {
                const marker = L.marker(ptLatLng, { icon: markerIcon }).addTo(currentRouteMapInstance);
                if (popupContent) {
                    marker.bindPopup(popupContent);
                }
                currentRouteMarkers.push(marker);
            }
        });

        // Gambar Polyline Jalur Pelacakan
        if (latLngs.length > 1) {
            currentRoutePolyline = L.polyline(latLngs, {
                color: '#ea580c', // Oranye kontras tinggi
                weight: 5,
                opacity: 0.85,
                smoothFactor: 1
            }).addTo(currentRouteMapInstance);
        }

        currentRouteBounds = bounds;

        setTimeout(() => {
            currentRouteMapInstance.invalidateSize();
            if (currentRouteBounds && currentRouteBounds.isValid()) {
                currentRouteMapInstance.fitBounds(currentRouteBounds, { padding: [50, 50], maxZoom: 16 });
            }
        }, 250);
    }

    function fitRouteMapBounds() {
        if (currentRouteMapInstance && currentRouteBounds && currentRouteBounds.isValid()) {
            currentRouteMapInstance.fitBounds(currentRouteBounds, { padding: [50, 50], maxZoom: 16 });
        }
    }

    function renderAllSalesMapFromState() {
        const mapContainer = document.getElementById('leafletAllSalesMap');

        if (typeof L === 'undefined') {
            console.error('Leaflet library is not loaded');

                </div>`;

                    popupContent = `

                        </div>

                } else if (p.type === 'DISCONNECTED' && showDisconnect) {
                    markerIcon = L.divIcon({
                        className: 'leaflet-custom-marker',

                    });
                    popupContent = `
                        <div class="p-1 min-w-[190px] text-xs space-y-1 text-slate-800">
                            <div class="font-extrabold text-rose-600 pb-1 border-b border-slate-100 flex items-center gap-1">
                                <i class="fa-solid fa-link-slash"></i> SINYAL PUTUS: ${track.nama}
                            </div>
                            <div><b>Waktu Putus:</b> ${p.time} WIB</div>
                            <div class="text-slate-500 text-[11px]">${p.note || 'Sinyal GPS hilang / izin off'}</div>
                            <div class="text-[10px] text-slate-400 font-mono-code">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div>
                        </div>
                    `;
                } else if (p.type === 'RECONNECTED' && showReconnect) {
                    markerIcon = L.divIcon({
                        className: 'leaflet-custom-marker',
                        html: `<div class="w-6 h-6 rounded-full bg-sky-500 text-white flex items-center justify-center font-bold text-xs shadow-lg border-2 border-white ring-2 ring-sky-400/50"><i class="fa-solid fa-link text-[10px]"></i></div>`,
                        iconSize: [24, 24],
                        iconAnchor: [12, 12]
                    });
                    popupContent = `
                        <div class="p-1 min-w-[190px] text-xs space-y-1 text-slate-800">
                            <div class="font-extrabold text-sky-600 pb-1 border-b border-slate-100 flex items-center gap-1">
                                <i class="fa-solid fa-rotate"></i> SAMBUNG ULANG: ${track.nama}
                            </div>
                            <div><b>Waktu:</b> ${p.time} WIB</div>
                            <div class="text-slate-500 text-[11px]">${p.note || 'Tersambung kembali'}</div>
                            <div class="text-[10px] text-slate-400 font-mono-code">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div>
                        </div>
                    `;
                } else if (p.type === 'CLOCK_OUT' && showOut) {
                    markerIcon = L.divIcon({
                        className: 'leaflet-custom-marker',
                        html: `<div class="w-7 h-7 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-xs shadow-lg border-2 border-white ring-2 ring-slate-400/50"><i class="fa-solid fa-flag-checkered text-[10px]"></i></div>`,
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    });
                    popupContent = `
                        <div class="p-1 min-w-[200px] text-xs space-y-1 text-slate-800">
                            <div class="font-extrabold text-slate-900 pb-1 border-b border-slate-100 flex items-center gap-1">
                                <i class="fa-solid fa-flag-checkered"></i> CLOCK-OUT: ${track.nama}
                            </div>
                            <div><b>Jam Out:</b> ${p.time || track.absen?.jamOut || '--:--'} WIB</div>
                            <div><b>Stasiun:</b> ${track.absen?.stasiunOut || track.absen?.stasiun || '-'}</div>
                            <div><b>Realisasi:</b> WO ${track.absen?.aktualWo || 0} | HC ${track.absen?.aktualHc || 0}</div>
                            <div class="text-[10px] text-slate-400 font-mono-code">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div>
                            ${track.absen?.fotoOut ? `<a href="${track.absen.fotoOut}" target="_blank" class="block text-center mt-1 py-1 bg-slate-900 text-white rounded-lg font-bold">Lihat Foto Out</a>` : ''}
                        </div>
                    `;
                }

                if (markerIcon) {
                    const marker = L.marker(latLng, { icon: markerIcon }).addTo(allSalesMapInstance);
                    if (popupContent) marker.bindPopup(popupContent);
                    allSalesMapLayers.push(marker);
                }

                routeLatLngs.push(latLng);
            });

            if (showRoute && routeLatLngs.length > 1) {
                const polyline = L.polyline(routeLatLngs, {
                    color: salesColor,
                    weight: 4,
                    opacity: 0.85,
                    smoothFactor: 1
                }).addTo(allSalesMapInstance);

                polyline.bindTooltip(`<b>${track.nama}</b> (${track.totalJarakKm || 0} km)`, { sticky: true });
                allSalesMapLayers.push(polyline);
            }
        });

        allSalesMapBounds = bounds;

        const updateMapView = () => {
            if (!allSalesMapInstance) return;
            allSalesMapInstance.invalidateSize();
            if (validPointCount > 0 && allSalesMapBounds && allSalesMapBounds.isValid()) {
                allSalesMapInstance.fitBounds(allSalesMapBounds, { padding: [40, 40], maxZoom: 15 });
            } else if (allSalesMapDataCache.length > 0) {
                let centerSet = false;
                for (let t of allSalesMapDataCache) {
                    if (t.waypoints && t.waypoints.length > 0 && typeof t.waypoints[0].lat === 'number') {
                        allSalesMapInstance.setView([t.waypoints[0].lat, t.waypoints[0].lng], 13);
                        centerSet = true;
                        break;
                    }
                }
                if (!centerSet) {
                    allSalesMapInstance.setView([-7.2575, 112.7521], 8);
                }
            } else {
                allSalesMapInstance.setView([-7.2575, 112.7521], 8);
            }
        };

        setTimeout(updateMapView, 50);
        setTimeout(updateMapView, 250);
        setTimeout(updateMapView, 600);
    }

    function renderAllSalesRosterList(tracks, activeUsername) {
        const container = document.getElementById('allMapSalesListContainer');
        const countEl = document.getElementById('allMapCountSales');
        const avgEl = document.getElementById('allMapAvgKmHeader');
        if (!container) return;

        if (countEl) countEl.textContent = tracks.length;

        let sumKm = 0;
        tracks.forEach(t => { sumKm += Number(t.totalJarakKm || 0); });
        const avgKm = tracks.length > 0 ? (sumKm / tracks.length).toFixed(2) : '0.00';
        if (avgEl) avgEl.textContent = `Rata: ${avgKm} km`;

        if (tracks.length === 0) {
            container.innerHTML = `
                <div class="p-6 text-center text-slate-400 text-xs">
                    <i class="fa-solid fa-map-pin text-2xl mb-1.5 opacity-40 block"></i>
                    Belum ada data kehadiran atau pergerakan sales pada tanggal ini.
                </div>
            `;
            return;
        }

        container.innerHTML = tracks.map((t, idx) => {
            const isSelected = activeUsername && t.username.toLowerCase() === activeUsername;
            const salesColor = SALES_ROUTE_COLORS[idx % SALES_ROUTE_COLORS.length];
            const isCompleted = t.statusKoneksi === 'COMPLETED' || t.absen?.jamOut;
            const isDisconnected = t.statusKoneksi === 'DISCONNECTED';

            const statusBadge = isCompleted
                ? `<span class="px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-slate-100 text-slate-600 border border-slate-200">Selesai</span>`
                : isDisconnected
                    ? `<span class="px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-rose-50 text-rose-600 border border-rose-200 animate-pulse">Terputus</span>`
                    : `<span class="px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block mr-0.5"></span> Aktif</span>`;

            return `
                <div onclick="focusSalesRouteOnMap('${t.username}', '${t.nama}')"
                    class="p-2.5 rounded-xl border transition cursor-pointer select-none ${isSelected ? 'bg-white border-sky-500 shadow-sm ring-2 ring-sky-500/20' : 'bg-white hover:bg-slate-100 border-slate-200/80 shadow-2xs'}">
                    <div class="flex items-center justify-between gap-1 mb-1">
                        <div class="flex items-center gap-1.5 min-w-0">
                            <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${salesColor};"></span>
                            <span class="font-bold text-xs text-slate-900 truncate">${t.nama}</span>
                        </div>
                        ${statusBadge}
                    </div>
                    <div class="flex items-center justify-between text-[10.5px] text-slate-500 font-medium">
                        <span><i class="fa-solid fa-train text-[9px] mr-1 text-slate-400"></i>${t.absen?.stasiunIn || t.absen?.stasiun || '-'}</span>
                        <span class="font-mono-code font-bold text-orange-600">${(t.totalJarakKm || 0).toFixed(2)} km</span>
                    </div>
                    <div class="flex items-center justify-between text-[10px] text-slate-400 mt-1 pt-1 border-t border-slate-100">
                        <span>In: ${t.absen?.jamIn || '--:--'} | Out: ${t.absen?.jamOut || '--:--'}</span>
                        <span>${t.waypoints?.length || 0} titik</span>
                    </div>
                </div>
            `;
        }).join('');
    }

    function focusSalesRouteOnMap(username, nama) {
        const dropdown = document.getElementById('flt_allmap_sales');
        if (dropdown) {
            const composite = (nama ? `${username}|${nama}` : username);
            dropdown.value = composite;
            if (!dropdown.value) dropdown.value = username;
        }
        renderAllSalesMapFromState();
        const mapEl = document.getElementById('leafletAllSalesMap');
        if (mapEl) {
            mapEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }

    function fitAllSalesMapBounds() {
        if (allSalesMapInstance && allSalesMapBounds && allSalesMapBounds.isValid()) {
            allSalesMapInstance.fitBounds(allSalesMapBounds, { padding: [50, 50], maxZoom: 15 });
        }
    }
</script>
