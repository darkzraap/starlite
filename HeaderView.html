<!-- TOP CLEAN LIGHT HEADER BAR (VANTUS ERP STYLE - h-14) -->
<header
    class="bg-white text-slate-800 h-14 px-3 sm:px-6 flex items-center justify-between sticky top-0 z-20 shrink-0 border-b border-slate-200/80 shadow-2xs">
    <div class="flex items-center gap-3">
        <!-- Mobile Sidebar Toggle -->
        <button type="button" onclick="toggleMobileSidebar()"
            class="md:hidden p-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">
            <i class="fa-solid fa-bars text-sm"></i>
        </button>

        <!-- Brand Info for Mobile -->
        <div class="flex md:hidden items-center gap-2">
            <div class="w-7 h-7 rounded-lg bg-sky-500/10 border border-sky-500/20 flex items-center justify-center p-0.5">
                <i class="fa-solid fa-bolt text-sky-600 text-xs"></i>
            </div>
            <span class="font-extrabold text-sm tracking-tight text-slate-900">STARLITE</span>
        </div>

        <!-- Breadcrumbs & Dynamic Page Header (Desktop) -->
        <div class="hidden md:flex flex-col">
            <div class="flex items-center gap-1.5 text-[11px] text-slate-400 font-medium">
                <span id="adminBreadcrumbParent">Starlite Operations</span>
                <span>/</span>
                <span id="adminBreadcrumbChild" class="text-sky-700 font-semibold">Attendance Harian</span>
            </div>
            <h2 id="adminHeaderTitle" class="text-sm font-extrabold text-slate-900 tracking-tight leading-none mt-0.5">Attendance Harian</h2>
        </div>

        <!-- Hidden Top Nav Pills for Backward Compatibility -->
        <nav id="adminTopNav" class="hidden">
            <button onclick="switchAdminTab('tabMonitoring')" id="navBtn_tabMonitoring">Attendance Harian</button>
            <button onclick="switchAdminTab('tabBelumAbsen')" id="navBtn_tabBelumAbsen">
                <span>Belum Clock-In</span>
                <span id="badgeNavBelum">0</span>
            </button>
            <button onclick="switchAdminTab('tabSummary')" id="navBtn_tabSummary">
                <span>Rekap Akumulasi</span>
                <span id="badgeNavLate">0</span>
            </button>
            <button onclick="switchAdminTab('tabAllLogs')" id="navBtn_tabAllLogs">Semua Database Absensi</button>
            <button onclick="switchAdminTab('tabUsers')" id="navBtn_tabUsers">Kelola Akun Personel</button>
            <button onclick="switchAdminTab('tabStations')" id="navBtn_tabStations">Database Stasiun</button>
            <button onclick="switchAdminTab('tabSettings')" id="navBtn_tabSettings">Jam Kerja & Sistem</button>
        </nav>
    </div>

    <!-- Right Clock, User Info & Logout -->
    <div class="flex items-center gap-2 sm:gap-3">
        <!-- Live Real-Time Clock Badge -->
        <div class="flex items-center gap-2 bg-slate-50 border border-slate-200/90 px-3 py-1.5 rounded-xl shadow-2xs">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="liveClock" class="font-mono-code text-xs font-bold text-slate-700">--:--:-- WIB</span>
        </div>

        <!-- User Info & Logout Button -->
        <div class="flex items-center gap-2.5 pl-2 border-l border-slate-200">
            <div class="hidden sm:block text-right leading-tight">
                <p id="navUserName" class="text-xs font-bold text-slate-800"></p>
                <p id="navUserSub" class="text-[10.5px] text-slate-500"></p>
            </div>
            <button onclick="handleLogout()" title="Keluar / Logout"
                class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 border border-slate-200/80 flex items-center justify-center transition shadow-2xs">
                <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
            </button>
        </div>
    </div>
</header>
