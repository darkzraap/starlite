<script>
    const SESSION_STORAGE_KEY = 'STARLITE_AUTH_SESSION_V3';
    const PAGE_SIZE = 30; // 30 data per halaman

    let currentUser = null;
    let workSettings = { maxClockIn: '09:00', minClockOut: '18:00' };
    let currentAttendanceType = 'IN';
    let mediaStream = null;
    let nativePhotoBase64 = null;
    let currentLocation = { lat: null, lng: null };
    let masterSalesOnly = [];

    const tableState = {
        todayLogs: { data: [], filters: {}, page: 1 },
        belumAbsen: { data: [], filters: {}, page: 1 },
        summary: { data: [], filters: {}, page: 1 },
        allLogs: { data: [], filters: {}, page: 1 },
        users: { data: [], filters: {}, page: 1 },
        salesHistory: { data: [], filters: {}, page: 1 },
        userDetail: { data: [], filters: {}, page: 1 }
    };

    function showLoading(text = 'Memuat data...') {
        document.getElementById('loadingText').textContent = text;
        document.getElementById('loadingOverlay').classList.remove('hidden');
        document.getElementById('loadingOverlay').classList.add('flex');
    }

    function hideLoading() {
        document.getElementById('loadingOverlay').classList.add('hidden');
        document.getElementById('loadingOverlay').classList.remove('flex');
    }

    // ================= GENERIC FILTER & 30-ROW PAGINATION =================
    function updateTableFilter(tableKey, colName, val) {
        tableState[tableKey].filters[colName] = String(val || '').toLowerCase().trim();
        tableState[tableKey].page = 1;
        renderTable(tableKey);
    }

    function resetTableFilters(tableKey) {
        tableState[tableKey].filters = {};
        tableState[tableKey].page = 1;
        const inputs = document.querySelectorAll(`[id^="flt_${tableKey}_"]`);
        inputs.forEach(el => { el.value = ''; });
        renderTable(tableKey);
    }

    function changeTablePage(tableKey, newPage) {
        tableState[tableKey].page = newPage;
        renderTable(tableKey);
    }

    function getFilteredAndPagedData(tableKey) {
        const state = tableState[tableKey];
        const raw = state.data || [];
        const activeFilters = state.filters || {};

        const filtered = raw.filter(row => {
            for (const col in activeFilters) {
                const fVal = activeFilters[col];
                if (!fVal) continue;
                let cellVal = String(row[col] !== undefined ? row[col] : '').toLowerCase();
                if (col === 'nama' && row.username) {
                    cellVal += ' ' + String(row.username).toLowerCase();
                }
                if (col === 'jamIn' && row.jamOut) {
                    cellVal += ' ' + String(row.jamOut).toLowerCase();
                }
                if (!cellVal.includes(fVal)) return false;
            }
            return true;
        });

        const totalRows = filtered.length;
        const totalPages = Math.max(1, Math.ceil(totalRows / PAGE_SIZE));
        if (state.page > totalPages) state.page = totalPages;
        if (state.page < 1) state.page = 1;

        const startIdx = (state.page - 1) * PAGE_SIZE;
        const sliced = filtered.slice(startIdx, startIdx + PAGE_SIZE);

        return { sliced, totalRows, totalPages, currentPage: state.page, startIdx };
    }

    function renderPaginationBar(tableKey, meta) {
        const container = document.getElementById(`pager_${tableKey}`);
        if (!container) return;

        const fromRow = meta.totalRows === 0 ? 0 : meta.startIdx + 1;
        const toRow = Math.min(meta.startIdx + PAGE_SIZE, meta.totalRows);

        let pageButtons = '';
        const maxButtons = 5;
        let startPage = Math.max(1, meta.currentPage - 2);
        let endPage = Math.min(meta.totalPages, startPage + maxButtons - 1);
        if (endPage - startPage < maxButtons - 1) {
            startPage = Math.max(1, endPage - maxButtons + 1);
        }

        for (let p = startPage; p <= endPage; p++) {
            const activeClass = p === meta.currentPage
                ? 'bg-[#1c2434] text-white font-bold border-[#1c2434]'
                : 'bg-white text-slate-600 hover:bg-slate-100 border-slate-200';
            pageButtons += `<button onclick="changeTablePage('${tableKey}', ${p})" class="w-6 h-6 rounded border text-[11px] transition ${activeClass}">${p}</button>`;
        }

        container.innerHTML = `
            <div class="text-slate-500">
              Menampilkan <strong class="text-slate-800">${fromRow}–${toRow}</strong> dari <strong class="text-slate-800">${meta.totalRows}</strong> data (30/hal)
            </div>
            <div class="flex items-center gap-1">
              <button onclick="changeTablePage('${tableKey}', ${meta.currentPage - 1})" ${meta.currentPage <= 1 ? 'disabled' : ''}
                class="px-2 h-6 rounded border border-slate-200 bg-white hover:bg-slate-100 disabled:opacity-40 text-slate-600 font-semibold">
                Prev
              </button>
              ${pageButtons}
              <button onclick="changeTablePage('${tableKey}', ${meta.currentPage + 1})" ${meta.currentPage >= meta.totalPages ? 'disabled' : ''}
                class="px-2 h-6 rounded border border-slate-200 bg-white hover:bg-slate-100 disabled:opacity-40 text-slate-600 font-semibold">
                Next
              </button>
            </div>
        `;
    }

    function calcDurationLabel(jamIn, jamOut) {
        if (!jamIn || !jamOut) return 'Belum Out';
        const p1 = String(jamIn).split(':').map(Number);
        const p2 = String(jamOut).split(':').map(Number);
        if (p1.length < 2 || p2.length < 2) return '-';
        const m1 = (p1[0] * 60) + p1[1];
        const m2 = (p2[0] * 60) + p2[1];
        const diff = m2 - m1;
        if (diff <= 0) return '-';
        return `${Math.floor(diff / 60)}h ${diff % 60}m`;
    }

    function renderTable(tableKey) {
        const meta = getFilteredAndPagedData(tableKey);
        const tbody = document.getElementById(`tbody_${tableKey}`);
        if (!tbody) return;

        if (tableKey === 'todayLogs' || tableKey === 'allLogs') {
            const isAll = tableKey === 'allLogs';
            const colSpan = isAll ? 11 : 10;
            if (meta.sliced.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${colSpan}" class="p-6 text-center text-slate-400">Tidak ada data absensi pada filter ini.</td></tr>`;
            } else {
                tbody.innerHTML = meta.sliced.map(l => {
                    const isLate = l.statusIn === 'Late';
                    const inTimeColor = isLate ? 'text-amber-600 font-bold' : 'text-slate-800 font-semibold';
                    const outTimeLabel = l.jamOut ? `<span class="text-slate-800 font-semibold">${l.jamOut}</span>` : `<span class="text-rose-500 font-medium">--:--</span>`;
                    const durLabel = calcDurationLabel(l.jamIn, l.jamOut);

                    const statusInBadge = isLate
                        ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-50 text-amber-700 border border-amber-200">Late</span>`
                        : `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-teal-50 text-teal-700 border border-teal-200">On Time</span>`;

                    const statusOutBadge = l.jamOut
                        ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">Lengkap</span>`
                        : `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-rose-50 text-rose-600 border border-rose-200">Belum Out</span>`;

                    const picCell = `
                        <div class="flex items-center gap-1">
                          ${l.fotoIn ? `<a href="${l.fotoIn}" target="_blank" class="px-1.5 py-0.5 rounded bg-slate-100 hover:bg-teal-50 text-teal-700 font-semibold text-[10.5px] border border-slate-200">Foto In</a>` : '-'}
                          ${l.fotoOut ? `<a href="${l.fotoOut}" target="_blank" class="px-1.5 py-0.5 rounded bg-slate-100 hover:bg-indigo-50 text-indigo-700 font-semibold text-[10.5px] border border-slate-200">Foto Out</a>` : ''}
                        </div>
                    `;

                    const locCell = `
                        <div class="flex flex-col gap-0.5">
                          ${l.mapsIn ? `<a href="${l.mapsIn}" target="_blank" class="text-teal-700 hover:underline font-medium text-[10.5px]"><i class="fa-solid fa-location-dot"></i> In: ${l.koordinatIn}</a>` : '-'}
                          ${l.mapsOut ? `<a href="${l.mapsOut}" target="_blank" class="text-indigo-700 hover:underline font-medium text-[10.5px]"><i class="fa-solid fa-location-dot"></i> Out: ${l.koordinatOut}</a>` : ''}
                        </div>
                    `;

                    return `
                        <tr class="tiimi-row">
                          ${isAll ? `<td class="tiimi-td font-mono-code text-[11px] text-slate-600 whitespace-nowrap">${l.tanggal}</td>` : ''}
                          <td class="tiimi-td">
                            <div class="font-bold text-slate-900 leading-tight">${l.nama}</div>
                            <div class="text-[10px] text-slate-400 font-mono-code">${l.username}</div>
                          </td>
                          <td class="tiimi-td">
                            <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold ${l.statusSales === 'Inhouse' ? 'bg-blue-50 text-blue-700' : 'bg-purple-50 text-purple-700'}">${l.statusSales}</span>
                          </td>
                          <td class="tiimi-td text-slate-600">${l.provinsi}</td>
                          <td class="tiimi-td font-semibold text-slate-700">${l.stasiun}</td>
                          <td class="tiimi-td whitespace-nowrap">
                            <div class="inline-flex items-center gap-1.5 font-mono-code text-[11px]">
                              <span class="${inTimeColor}">${l.jamIn || '--:--'}</span>
                              <span class="text-[9.5px] font-sans text-slate-400 bg-slate-100 px-1.5 py-0.2 rounded">${durLabel}</span>
                              ${outTimeLabel}
                            </div>
                          </td>
                          <td class="tiimi-td">${statusInBadge}</td>
                          <td class="tiimi-td">${statusOutBadge}</td>
                          <td class="tiimi-td whitespace-nowrap">${picCell}</td>
                          <td class="tiimi-td whitespace-nowrap">${locCell}</td>
                          <td class="tiimi-td text-center">
                            <button onclick="openUserDetailModal('${l.username}')" class="px-2 py-1 bg-slate-100 hover:bg-teal-600 text-slate-700 hover:text-white rounded text-[10.5px] font-semibold border border-slate-200 transition">
                              <i class="fa-solid fa-eye mr-0.5"></i> Detail
                            </button>
                          </td>
                        </tr>
                    `;
                }).join('');
            }
        }

        else if (tableKey === 'belumAbsen') {
            if (meta.sliced.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-teal-600 font-semibold">Seluruh sales sudah melakukan Clock-In pada tanggal ini.</td></tr>`;
            } else {
                tbody.innerHTML = meta.sliced.map(u => `
                    <tr class="tiimi-row">
                      <td class="tiimi-td font-bold text-slate-900">${u.nama}</td>
                      <td class="tiimi-td font-mono-code text-[11px] text-slate-500">${u.username}</td>
                      <td class="tiimi-td"><span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-slate-100 text-slate-700">${u.status}</span></td>
                      <td class="tiimi-td text-slate-600">${u.provinsi}</td>
                      <td class="tiimi-td font-semibold text-slate-800">${u.stasiun}</td>
                      <td class="tiimi-td"><span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-50 text-rose-600 border border-rose-200">Belum Clock-In</span></td>
                      <td class="tiimi-td text-center">
                        <button onclick="openUserDetailModal('${u.username}')" class="px-2 py-1 bg-slate-100 hover:bg-teal-600 text-slate-700 hover:text-white rounded text-[10.5px] font-semibold border border-slate-200 transition">
                          <i class="fa-solid fa-eye mr-0.5"></i> Detail
                        </button>
                      </td>
                    </tr>
                `).join('');
            }
        }

        else if (tableKey === 'summary') {
            if (meta.sliced.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" class="p-6 text-center text-slate-400">Tidak ada data rekap ditemukan.</td></tr>`;
            } else {
                tbody.innerHTML = meta.sliced.map(s => `
                    <tr class="tiimi-row">
                      <td class="tiimi-td">
                        <div class="font-bold text-slate-900">${s.nama}</div>
                        <div class="text-[10px] text-slate-400 font-mono-code">${s.username}</div>
                      </td>
                      <td class="tiimi-td"><span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-slate-100 text-slate-700">${s.status}</span></td>
                      <td class="tiimi-td text-slate-600">${s.provinsi}</td>
                      <td class="tiimi-td font-semibold text-slate-700">${s.stasiun}</td>
                      <td class="tiimi-td text-center">
                        <span class="px-2 py-0.5 rounded font-bold ${s.totalBelumIn > 0 ? 'bg-rose-50 text-rose-600 border border-rose-200' : 'text-slate-400'}">${s.totalBelumIn}</span>
                      </td>
                      <td class="tiimi-td text-center font-bold text-slate-900">${s.totalHadir}</td>
                      <td class="tiimi-td text-center font-bold text-teal-600">${s.totalOnTime}</td>
                      <td class="tiimi-td text-center">
                        <span class="px-2 py-0.5 rounded font-bold ${s.totalLate > 0 ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'text-slate-400'}">${s.totalLate}x</span>
                      </td>
                      <td class="tiimi-td text-center">
                        <span class="px-2 py-0.5 rounded font-bold ${s.totalBelumOut > 0 ? 'bg-indigo-50 text-indigo-600 border border-indigo-200' : 'text-slate-400'}">${s.totalBelumOut}</span>
                      </td>
                      <td class="tiimi-td text-center">
                        <span class="px-2 py-0.5 rounded font-bold ${s.totalLengkap > 0 ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'text-slate-400'}">${s.totalLengkap}</span>
                      </td>
                      <td class="tiimi-td text-center">
                        <button onclick="openUserDetailModal('${s.username}')" class="px-2 py-1 bg-slate-100 hover:bg-teal-600 text-slate-700 hover:text-white rounded text-[10.5px] font-semibold border border-slate-200 transition">
                          <i class="fa-solid fa-eye mr-0.5"></i> Detail
                        </button>
                      </td>
                    </tr>
                `).join('');
            }
        }

        else if (tableKey === 'users') {
            if (meta.sliced.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">Data akun tidak ditemukan.</td></tr>`;
            } else {
                tbody.innerHTML = meta.sliced.map(u => `
                    <tr class="tiimi-row">
                      <td class="tiimi-td font-bold text-slate-900">${u.nama}</td>
                      <td class="tiimi-td font-mono-code text-[11px]">
                        <span class="text-teal-700 font-semibold">${u.username}</span>
                        <span class="text-slate-400 ml-1">(${u.password})</span>
                      </td>
                      <td class="tiimi-td">
                        <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${u.role === 'Admin' ? 'bg-rose-50 text-rose-700' : 'bg-teal-50 text-teal-700'}">${u.role}</span>
                      </td>
                      <td class="tiimi-td text-slate-700">${u.status}</td>
                      <td class="tiimi-td text-slate-600">${u.provinsi}</td>
                      <td class="tiimi-td font-semibold text-slate-800">${u.stasiun}</td>
                      <td class="tiimi-td text-center whitespace-nowrap space-x-1">
                        <button onclick="openUserDetailModal('${u.username}')" class="px-2 py-1 bg-teal-50 hover:bg-teal-600 text-teal-700 hover:text-white rounded border border-teal-200 text-[10.5px] font-semibold transition" title="Lihat Semua Riwayat Absen & Maps">
                          <i class="fa-solid fa-list-check mr-0.5"></i> Detail
                        </button>
                        <button onclick='editUser(${JSON.stringify(u)})' class="px-2 py-1 bg-slate-100 hover:bg-amber-50 text-slate-600 hover:text-amber-700 rounded border border-slate-200 transition" title="Edit Akun">
                          <i class="fa-solid fa-pen text-[10px]"></i>
                        </button>
                        <button onclick="deleteUser('${u.id}', '${u.nama}')" class="px-2 py-1 bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 rounded border border-slate-200 transition" title="Hapus Akun & Seluruh Database Absensinya">
                          <i class="fa-solid fa-trash text-[10px]"></i>
                        </button>
                      </td>
                    </tr>
                `).join('');
            }
        }

        else if (tableKey === 'salesHistory') {
            if (meta.sliced.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-5 text-center text-slate-400">Belum ada riwayat absensi.</td></tr>`;
            } else {
                tbody.innerHTML = meta.sliced.map(h => `
                    <tr class="tiimi-row">
                      <td class="tiimi-td font-mono-code text-[11px] font-semibold text-slate-800">${h.tanggal}</td>
                      <td class="tiimi-td font-mono-code text-[11px]">
                        <span class="${h.statusIn === 'Late' ? 'text-amber-600 font-bold' : 'text-slate-800 font-semibold'}">${h.jamIn || '--:--'}</span>
                        <span class="mx-1 text-slate-300">→</span>
                        <span class="text-slate-700 font-semibold">${h.jamOut || '--:--'}</span>
                      </td>
                      <td class="tiimi-td">
                        <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${h.statusIn === 'Late' ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-teal-50 text-teal-700 border border-teal-200'}">${h.statusIn}</span>
                      </td>
                      <td class="tiimi-td">
                        ${h.jamOut ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">Completed</span>` : `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-rose-50 text-rose-600">Belum Out</span>`}
                      </td>
                      <td class="tiimi-td whitespace-nowrap space-x-1">
                        ${h.mapsIn ? `<a href="${h.mapsIn}" target="_blank" class="text-teal-700 hover:underline text-[10.5px] font-medium">Maps In</a>` : ''}
                        ${h.fotoIn ? `<a href="${h.fotoIn}" target="_blank" class="text-slate-600 hover:underline text-[10.5px]">Foto In</a>` : ''}
                        ${h.mapsOut ? `<a href="${h.mapsOut}" target="_blank" class="text-indigo-700 hover:underline text-[10.5px] font-medium">Maps Out</a>` : ''}
                      </td>
                    </tr>
                `).join('');
            }
        }

        else if (tableKey === 'userDetail') {
            if (meta.sliced.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">Belum ada riwayat absensi untuk personel ini.</td></tr>`;
            } else {
                tbody.innerHTML = meta.sliced.map(r => `
                    <tr class="tiimi-row">
                      <td class="tiimi-td font-mono-code font-bold text-slate-800">${r.tanggal}</td>
                      <td class="tiimi-td font-mono-code font-semibold text-slate-800">${r.jamIn || '-'}</td>
                      <td class="tiimi-td">
                        <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${r.statusIn === 'Late' ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-teal-50 text-teal-700 border border-teal-200'}">${r.statusIn}</span>
                      </td>
                      <td class="tiimi-td whitespace-nowrap space-x-1.5">
                        ${r.mapsIn ? `<a href="${r.mapsIn}" target="_blank" class="px-1.5 py-0.5 bg-teal-50 text-teal-700 rounded border border-teal-200 text-[10.5px] font-semibold hover:bg-teal-600 hover:text-white"><i class="fa-solid fa-location-dot"></i> ${r.koordinatIn}</a>` : '-'}
                        ${r.fotoIn ? `<a href="${r.fotoIn}" target="_blank" class="px-1.5 py-0.5 bg-slate-100 text-slate-700 rounded border border-slate-200 text-[10.5px] font-semibold hover:bg-slate-800 hover:text-white"><i class="fa-regular fa-image"></i> Foto In</a>` : ''}
                      </td>
                      <td class="tiimi-td font-mono-code font-semibold text-slate-800">${r.jamOut || '--:--'}</td>
                      <td class="tiimi-td">
                        ${r.jamOut ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">Completed</span>` : `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-rose-50 text-rose-600 border border-rose-200">Belum Clock-Out</span>`}
                      </td>
                      <td class="tiimi-td whitespace-nowrap space-x-1.5">
                        ${r.mapsOut ? `<a href="${r.mapsOut}" target="_blank" class="px-1.5 py-0.5 bg-indigo-50 text-indigo-700 rounded border border-indigo-200 text-[10.5px] font-semibold hover:bg-indigo-600 hover:text-white"><i class="fa-solid fa-location-dot"></i> ${r.koordinatOut}</a>` : '-'}
                        ${r.fotoOut ? `<a href="${r.fotoOut}" target="_blank" class="px-1.5 py-0.5 bg-slate-100 text-slate-700 rounded border border-slate-200 text-[10.5px] font-semibold hover:bg-slate-800 hover:text-white"><i class="fa-regular fa-image"></i> Foto Out</a>` : ''}
                      </td>
                    </tr>
                `).join('');
            }
        }

        renderPaginationBar(tableKey, meta);
    }
</script>
